name: Capture typecheck diagnostics

on:
  push:
    branches:
      - feat/message-attachments
    paths:
      - .github/workflows/capture-typecheck.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/message-attachments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Capture typecheck
        run: |
          set +e
          pnpm exec tsc --noEmit > typecheck-errors.txt 2>&1
          code=$?
          echo "exit_code=$code" >> typecheck-errors.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add typecheck-errors.txt
          git commit -m "chore: capture typecheck diagnostics"
          git push origin HEAD:feat/message-attachments
