name: Finalize Routing Rules Once

on:
  push:
    branches: [routing-final-rules]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: routing-final-rules
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final routing contract
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, got {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, repl, label):
              text, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, got {count}')
              return text

          # Automatic routing: daily reception limit is a hard candidate gate.
          path = 'src/worker/routing.ts'
          text = read(path)
          text = replace_once(
              text,
              ''' * Automatic traffic delivery is deliberately presence-agnostic: online/busy,\n * heartbeat freshness, active load and daily reception limits do not decide who\n * receives traffic. A fresh billable conversation only requires an enabled,\n * configured seat with available paid traffic quota. Already-receipted traffic\n * can always be requeued without consuming another unit.\n''',
              ''' * Automatic traffic delivery is deliberately presence-agnostic: online/busy,\n * heartbeat freshness and active load do not decide who receives traffic. A seat\n * must still be below its Los Angeles business-day reception limit and, for fresh\n * billable traffic, have available paid traffic quota. Already-receipted traffic\n * never consumes another paid unit, but it still respects the daily reception cap.\n''',
              'routing comment',
          )
          text = replace_once(
              text,
              '''         JOIN context ctx ON ctx.site_id = a.site_id\n         WHERE a.is_enabled = 1\n''',
              '''         JOIN context ctx ON ctx.site_id = a.site_id\n         LEFT JOIN agent_daily_stats daily\n           ON daily.site_id = a.site_id\n          AND daily.agent_id = a.id\n          AND daily.business_date = ?3\n         WHERE a.is_enabled = 1\n''',
              'daily stats join',
          )
          text = replace_once(
              text,
              '''           AND a.username IS NOT NULL\n           AND a.password_hash IS NOT NULL\n           AND (\n             ctx.already_received = 1\n''',
              '''           AND a.username IS NOT NULL\n           AND a.password_hash IS NOT NULL\n           AND (\n             a.daily_conversation_limit = 0\n             OR COALESCE(daily.conversation_count, 0) < a.daily_conversation_limit\n           )\n           AND (\n             ctx.already_received = 1\n''',
              'daily limit gate',
          )
          write(path, text)

          # Admin editor: remove manual-transfer concurrency controls; daily cap is automatic routing policy.
          path = 'src/dashboard/AgentEditorModal.tsx'
          text = read(path)
          text = regex_once(
              text,
              r'''              <div className="agent-editor-section agent-editor-capacity-section">.*?              </div>\n\n              <div className="agent-editor-section agent-editor-quota-section">''',
              '''              <div className="agent-editor-section agent-editor-capacity-section">\n                <div className="agent-editor-section-head">\n                  <strong>每日接待上限</strong>\n                  <span className="agent-editor-section-hint">\n                    0 = 不限制 · 达到上限后当天停止自动分流\n                  </span>\n                </div>\n\n                <div className="agent-editor-capacity-grid">\n                  <label className="agent-editor-number-field">\n                    <strong>每日接待上限</strong>\n                    <div>\n                      <input\n                        type="number"\n                        min="0"\n                        max="9999"\n                        value={draft.dailyConversationLimit}\n                        onChange={(event) =>\n                          onDraftChange({\n                            ...draft,\n                            dailyConversationLimit:\n                              Number(event.target.value) || 0,\n                          })\n                        }\n                      />\n                      <em>次</em>\n                    </div>\n                  </label>\n                </div>\n              </div>\n\n              <div className="agent-editor-section agent-editor-quota-section">''',
              'capacity editor',
          )
          text = replace_once(
              text,
              '''                <p className="agent-editor-quota-note">\n                  每个会话首次有效接待只扣 1\n                  次。并发和每日接待上限只限制人工指定转接，不参与自动轮询；每日接待上限按天重置，咨询额度按累计总量计算。转接、重新排队和恢复同一会话不会重复扣减。\n                </p>''',
              '''                <p className="agent-editor-quota-note">\n                  每个会话首次有效接待只扣 1\n                  次。每日接待上限参与自动分流，并按洛杉矶业务日自动重置；咨询额度按累计总量计算。内部重新分配和等待恢复同一会话不会重复扣减咨询额度。\n                </p>''',
              'quota note',
          )
          write(path, text)

          # Agent API: remove manual transfer target discovery and transfer endpoint entirely.
          path = 'src/worker/agent-api.ts'
          text = read(path)
          text = text.replace(
              "import { assignConversationAgent, routingBusinessDate } from './routing';",
              "import { routingBusinessDate } from './routing';",
          )
          text = regex_once(
              text,
              r'''type TransferTargetRow = \{.*?type TransferConversationRow = \{.*?\};\n\n''',
              '',
              'transfer types',
          )
          text = regex_once(
              text,
              r'''async function loadTransferTargets\(.*?\n\}\n\nasync function loadAgentInbox''',
              'async function loadAgentInbox',
              'loadTransferTargets',
          )
          text = text.replace(
              '  const transferTargetsRequest = loadTransferTargets(db, agent.id);\n\n',
              '',
          )
          text = replace_once(
              text,
              '    const [result, overview, transferTargets] = await Promise.all([',
              '    const [result, overview] = await Promise.all([',
              'filtered inbox promise',
          )
          text = replace_once(
              text,
              '      loadAgentOverview(db, agent.id),\n      transferTargetsRequest,\n',
              '      loadAgentOverview(db, agent.id),\n',
              'filtered transfer request',
          )
          text = text.replace('      transferTargets,\n', '')
          text = replace_once(
              text,
              '  const [result, quotaOverview, transferTargets] = await Promise.all([',
              '  const [result, quotaOverview] = await Promise.all([',
              'unfiltered inbox promise',
          )
          text = replace_once(
              text,
              '    loadAgentQuotaOverview(db, agent.id),\n    transferTargetsRequest,\n',
              '    loadAgentQuotaOverview(db, agent.id),\n',
              'unfiltered transfer request',
          )
          text = text.replace('    transferTargets,\n', '')
          text = regex_once(
              text,
              r'''agentApi\.post\('/api/agent/conversations/:id/transfer'.*?\n\}\);\n\nagentApi\.get\('/api/agent/realtime/inbox' ''',
              "agentApi.get('/api/agent/realtime/inbox' ",
              'transfer endpoint',
          )
          text = regex_once(
              text,
              r'''async function assignedConversationForTransfer\(.*?\n\}\n\nasync function assignedConversation\(''',
              'async function assignedConversation(',
              'transfer helper',
          )
          text = regex_once(
              text,
              r'''\nfunction normalizeOptionalId\(.*?\n\}\n''',
              '\n',
              'transfer id normalizer',
          )
          write(path, text)

          # Dashboard API contract no longer exposes transfer targets or transfer actions.
          path = 'src/dashboard/api.ts'
          text = read(path)
          text = replace_once(
              text,
              '  transferTargets: TransferTarget[];\n',
              '',
              'AgentInbox transferTargets',
          )
          text = regex_once(
              text,
              r'''\nexport type TransferTarget = \{.*?\};\n''',
              '',
              'TransferTarget type',
          )
          text = text.replace("  INVALID_TRANSFER_TARGET: '请选择有效的转接客服',\n", '')
          text = text.replace("  TRANSFER_TARGET_UNAVAILABLE: '该客服当前无法接收新会话',\n", '')
          text = regex_once(
              text,
              r'''\nexport async function transferConversation\(.*?\n\}\n\nexport function openAgentInboxSocket''',
              '\nexport function openAgentInboxSocket',
              'dashboard transfer api',
          )
          write(path, text)

          # Agent workspace: remove manual transfer state, action and UI.
          path = 'src/dashboard/AgentPortal.tsx'
          text = read(path)
          text = text.replace('  TransferTarget,\n', '')
          text = text.replace('  transferConversation,\n', '')
          text = text.replace('  const [transferTargets, setTransferTargets] = useState<TransferTarget[]>([]);\n', '')
          text = text.replace('  const [transferring, setTransferring] = useState(false);\n', '')
          text = text.replace('    setTransferTargets(inbox.transferTargets);\n', '')
          text = replace_once(
              text,
              '''        if (payload.type === 'conversation.transferred') {\n          setSelectedId(null);\n          setDetail(null);\n          void refresh().catch(() => undefined);\n          return;\n        }\n\n''',
              '',
              'transfer realtime handler',
          )
          text = regex_once(
              text,
              r'''\n  async function handoffConversation\(.*?\n  \}\n\n  return \(''',
              '\n\n  return (',
              'handoff function',
          )
          text = regex_once(
              text,
              r'''\n                \{detail\.conversation\.status !== 'closed' && \(\n                  <details className="transfer-menu">.*?\n                \)\}''',
              '',
              'transfer menu',
          )
          write(path, text)

          # Admin copy reflects the final automatic routing rule.
          path = 'src/dashboard/AdminPortal.tsx'
          text = read(path)
          text = replace_once(
              text,
              "      ? '管理登录身份、人工转接限制、咨询额度和产品负责范围。自动分流采用严格轮询。'",
              "      ? '管理登录身份、每日接待上限、咨询额度和产品负责范围。自动分流采用严格轮询。'",
              'admin section hint',
          )
          write(path, text)

          # Documentation: one final routing model, no manual transfer feature.
          path = 'README.md'
          text = read(path)
          text = text.replace(
              '按产品负责范围、账号启用状态、已购买额度、CTA 两小时原客服优先和严格轮询，',
              '按产品负责范围、账号启用状态、每日接待上限、已购买额度、CTA 两小时原客服优先和严格轮询，',
          )
          text = text.replace(
              '→ 根据负责范围、账号启用状态和剩余额度筛选坐席',
              '→ 根据负责范围、账号启用状态、每日接待上限和剩余额度筛选坐席',
          )
          text = text.replace(
              '| 客服管理中心 `/`    | 配置客服账号、负责范围、人工转接限制、按量额度和统计 |',
              '| 客服管理中心 `/`    | 配置客服账号、负责范围、每日接待上限、按量额度和统计 |',
          )
          text = text.replace(
              '| 客服坐席端 `/agent` | 登录、接收分配会话、聊天、转接、头像、通知和个人工具 |',
              '| 客服坐席端 `/agent` | 登录、接收分配会话、聊天、头像、通知和个人工具       |',
          )
          text = text.replace(
              '- 负责范围、账号启用状态、按量额度和 CTA 原客服优先约束下的严格轮询；',
              '- 负责范围、账号启用状态、每日接待上限、按量额度和 CTA 原客服优先约束下的严格轮询；',
          )
          text = text.replace(
              '- 设置人工指定转接使用的同时会话和每日接待限制；',
              '- 设置参与自动分流的每日接待上限；',
          )
          text = text.replace('- 会话转给其他仍有容量的在线客服；\n', '')
          text = text.replace('- 排除自己后重新进入自动分流；\n', '')
          text = replace_once(
              text,
              '''已配置可登录的客服账号和密码\n未耗尽坐席总接待额度（未启用额度限制时跳过）\n不是本次手动退回自动分流时被排除的原客服\n```\n\n自动分流不读取在线 / 忙碌 / 离线状态、心跳新鲜度、当前进行中会话数、并发上限或每日接待上限。工作状态只用于坐席端展示和触发等待队列恢复，不改变严格轮询的候选资格。停用账号会撤销登录资格并释放仍未结束的会话重新分配。''',
              '''已配置可登录的客服账号和密码\n未达到当日接待上限（0 表示不限制）\n未耗尽坐席总接待额度（未启用额度限制时跳过）\n```\n\n自动分流不读取在线 / 忙碌 / 离线状态、心跳新鲜度、当前进行中会话数或并发上限。每日接待上限属于自动分流硬约束：达到上限后该客服在当前洛杉矶业务日退出候选池，下一个业务日自动重新进入。工作状态只用于坐席端展示和触发等待队列恢复，不改变严格轮询排序。停用账号会撤销登录资格并释放仍未结束的会话；释放后的会话仍通过同一套候选规则重新分配。''',
              'README candidates',
          )
          text = regex_once(
              text,
              r'''### 6\.5 人工转接\n.*?\n## 7\. 会话生命周期与计数''',
              '''### 6.5 每日接待上限\n\n`daily_conversation_limit` 直接参与自动分流。`0` 表示不限制；大于 `0` 时，系统读取 `agent_daily_stats` 中当前洛杉矶业务日的首次有效接待数，达到上限后跳过该客服。跨入下一个洛杉矶自然日后，无需 Cron 重置计数，新的业务日期天然从 0 开始。\n\n在线状态、心跳、当前并发量不影响这个规则。等待队列恢复、停用客服后的内部重新分配也统一调用同一套路由逻辑，不存在坐席端人工转接或手动重新排队入口。已生成的咨询流量凭证保持不可变，内部重新分配不会重复扣减已购买咨询额度。\n\n## 7. 会话生命周期与计数''',
              'README transfer section',
          )
          text = text.replace(
              '- 转接、重新排队、关闭、重新打开不重复计数；',
              '- 内部重新分配、关闭、重新打开不重复生成有效流量凭证；',
          )
          text = text.replace(
              '- Inbox 一次返回会话概览、额度摘要和可转接坐席；',
              '- Inbox 一次返回会话概览和额度摘要；',
          )
          write(path, text)

          # Lock the new contract in source-level regression coverage.
          write('test/strict-round-robin-contract.test.mjs', '''import assert from 'node:assert/strict';\nimport { readFile } from 'node:fs/promises';\nimport test from 'node:test';\n\nconst [readme, routing, editor, agentApi, dashboardApi, portal] =\n  await Promise.all([\n    readFile(new URL('../README.md', import.meta.url), 'utf8'),\n    readFile(new URL('../src/worker/routing.ts', import.meta.url), 'utf8'),\n    readFile(\n      new URL('../src/dashboard/AgentEditorModal.tsx', import.meta.url),\n      'utf8',\n    ),\n    readFile(new URL('../src/worker/agent-api.ts', import.meta.url), 'utf8'),\n    readFile(new URL('../src/dashboard/api.ts', import.meta.url), 'utf8'),\n    readFile(new URL('../src/dashboard/AgentPortal.tsx', import.meta.url), 'utf8'),\n  ]);\n\ntest('automatic routing stays presence-agnostic, daily-capped and strict round robin', () => {\n  assert.match(readme, /每日接待上限属于自动分流硬约束/u);\n  assert.match(readme, /不存在坐席端人工转接或手动重新排队入口/u);\n\n  assert.match(routing, /agent_daily_stats daily/u);\n  assert.match(routing, /a\\.daily_conversation_limit = 0/u);\n  assert.match(routing, /daily\\.business_date = \\?3/u);\n  assert.match(routing, /a\\.round_robin_seq ASC/u);\n  assert.doesNotMatch(routing, /a\\.status\\s*=/u);\n  assert.doesNotMatch(routing, /a\\.last_seen_at/u);\n  assert.doesNotMatch(routing, /a\\.max_active_conversations/u);\n\n  assert.match(editor, />每日接待上限</u);\n  assert.match(editor, /达到上限后当天停止自动分流/u);\n  assert.doesNotMatch(editor, /人工转接限制/u);\n  assert.doesNotMatch(editor, />并发上限</u);\n\n  for (const source of [agentApi, dashboardApi, portal]) {\n    assert.doesNotMatch(source, /transferTargets/u);\n    assert.doesNotMatch(source, /transferConversation/u);\n  }\n  assert.doesNotMatch(agentApi, /conversations\\/:id\\/transfer/u);\n  assert.doesNotMatch(portal, />转接</u);\n});\n''')

          # Behavioral coverage: cap one means exactly one fresh assignment that day.
          path = 'test/agent-daily-quota.test.mjs'
          old = read(path)
          # Preserve the proven fixture/migration setup, replace only the old behavior test.
          old = replace_once(
              old,
              "test('daily and active limits do not block automatic traffic delivery', async () => {\n  const database = await databaseWithDailyLimit(1);\n  addConversation(database, 'conversation-1');\n  addConversation(database, 'conversation-2');\n\n  const db = d1(database);\n  const first = await assignConversationAgent(db, 'conversation-1');\n  const second = await assignConversationAgent(db, 'conversation-2');\n\n  assert.equal(first?.id, 'agent-a');\n  assert.equal(second?.id, 'agent-a');\n  assert.equal(\n    database\n      .prepare(\n        `SELECT conversation_count AS count\n         FROM agent_daily_stats\n         WHERE agent_id = 'agent-a'`,\n      )\n      .get().count,\n    2,\n    'daily counts remain available for reporting even though they do not gate traffic',\n  );\n  database.close();\n});\n",
              "test('daily reception limit blocks fresh automatic traffic after the cap', async () => {\n  const database = await databaseWithDailyLimit(1);\n  addConversation(database, 'conversation-1');\n  addConversation(database, 'conversation-2');\n\n  const db = d1(database);\n  const first = await assignConversationAgent(db, 'conversation-1');\n  const second = await assignConversationAgent(db, 'conversation-2');\n\n  assert.equal(first?.id, 'agent-a');\n  assert.equal(second, null);\n  assert.equal(\n    database\n      .prepare(\n        `SELECT conversation_count AS count\n         FROM agent_daily_stats\n         WHERE agent_id = 'agent-a'`,\n      )\n      .get().count,\n    1,\n  );\n  assert.equal(\n    database\n      .prepare(\n        `SELECT assigned_agent FROM conversations\n         WHERE id = 'conversation-2'`,\n      )\n      .get().assigned_agent,\n    null,\n  );\n  database.close();\n});\n",
              'daily quota behavior test',
          )
          write(path, old)

          # Full flow: remove user-facing transfer flows while preserving internal disable/reassignment coverage.
          path = 'test/customer-service-full-flow.test.mjs'
          text = read(path)
          text = regex_once(
              text,
              r'''\n  const standbyToken = 'agent-session-standby';.*?  assert\.equal\(requeued\.assignment\.id, 'agent-standby'\);\n''',
              '\n',
              'full-flow transfer block',
          )
          text = text.replace("  const tokenA = 'quota-final-session-a';\n", '')
          text = text.replace("  const tokenB = 'quota-final-session-b';\n", '')
          text = text.replace(
              "  const expiresAt = new Date(Date.now() + 60 * 60 * 1000).toISOString();\n",
              '',
              1,
          )
          text = regex_once(
              text,
              r'''\n  database\n    \.prepare\(\n      `INSERT INTO agent_sessions \(id, agent_id, token_hash, expires_at\).*?\n    \);\n''',
              '\n',
              'commercial session setup',
          )
          replacement = '''\n  const beforeReassignmentB = database\n    .prepare(\n      `SELECT a.traffic_quota_used AS used,\n         COALESCE(SUM(s.conversation_count), 0) AS daily\n       FROM agents a\n       LEFT JOIN agent_daily_stats s ON s.agent_id = a.id\n       WHERE a.id = ?\n       GROUP BY a.id`,\n    )\n    .get(agentB);\n'''
          text = regex_once(
              text,
              r'''\n  const cookieA = `cs_agent_session=\$\{tokenA\}`;.*?  assert\.equal\(\n    database\n      \.prepare\('SELECT traffic_quota_used FROM agents WHERE id = \?'\)\n      \.get\(agentA\)\.traffic_quota_used,\n    2,\n  \);\n''',
              replacement,
              'commercial transfer/requeue block',
          )
          text = text.replace('beforeTransferB', 'beforeReassignmentB')
          text = replace_once(
              text,
              '''    [agentB, agentB, agentB],\n    'disabling a seat must reassign its already-counted active traffic even when the target has no new-traffic quota',\n''',
              '''    [null, null, null],\n    'disabling a seat must leave traffic waiting when every matching seat has reached its daily reception limit',\n''',
              'disable expected assignments',
          )
          text = text.replace(
              "    'reassignment after seat disable must not bill the target again',",
              "    'blocked reassignment must not change the capped target quota or daily count',",
          )
          text = text.replace(
              "    'immutable first-reception receipts must remain the billing source of truth after transfers',",
              "    'immutable first-reception receipts remain the billing source of truth after internal reassignment attempts',",
          )
          write(path, text)

          # Transfer-only tests no longer describe a supported product capability.
          for path in [
              'test/agent-transfer-context.test.mjs',
              'test/transfer-realtime-cost.test.mjs',
          ]:
              Path(path).unlink()
          PY

      - name: Format changed sources
        run: pnpm format:write

      - name: Commit final routing changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(routing): enforce daily cap and remove transfers"
          git push origin HEAD:routing-final-rules

      - name: Repository guardrails
        run: pnpm guardrails

      - name: Format check
        run: pnpm format

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check
