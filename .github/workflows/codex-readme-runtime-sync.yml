name: Codex README runtime sync

on:
  push:
    branches: [codex/readme-runtime-sync-20260815]

permissions:
  contents: write

concurrency:
  group: codex-customer-service-readme-runtime-sync
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/readme-runtime-sync-20260815
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Apply documentation sync
        run: python .github/scripts/apply_readme_runtime_sync.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify project
        run: pnpm verify
      - name: Commit verified documentation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-readme-runtime-sync.yml .github/scripts/apply_readme_runtime_sync.py
          git add README.md
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'docs: sync realtime and scope routing architecture'
          git push origin HEAD:codex/readme-runtime-sync-20260815
