name: Agent Delete Finalizer

on:
  push:
    branches: [fix/restore-agent-delete]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize verified agent deletion
        shell: bash
        run: |
          set -euo pipefail
          payload="$(sed -n "35s/.*echo '\([^']*\)'.*/\1/p" .github/workflows/ci.yml)"
          test -n "$payload"
          printf '%s' "$payload" | base64 -d | gzip -d > /tmp/restore-agent-delete.py
          python /tmp/restore-agent-delete.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/dashboard/AdminPortal.tsx')
          s = p.read_text()
          section = "  const sectionTitle = section === 'agents' ? '客服坐席' : '流量统计';\n"
          if section not in s:
              raise SystemExit('missing sectionTitle anchor')
          s = s.replace(section, "  const editingAgentId = draft.id;\n" + section, 1)
          ternary = "            draft.id\n              ? () =>\n"
          if ternary not in s:
              raise SystemExit('missing delete ternary anchor')
          s = s.replace(ternary, "            editingAgentId\n              ? () =>\n", 1)
          agent_id = "                    id: draft.id,\n"
          if agent_id not in s:
              raise SystemExit('missing delete id anchor')
          s = s.replace(agent_id, "                    id: editingAgentId,\n", 1)
          p.write_text(s)
          PY
          pnpm exec prettier --write src/dashboard/api.ts src/dashboard/AdminPortal.tsx src/dashboard/AgentEditorModal.tsx src/dashboard/agent-editor.css src/worker/admin-config-api.ts test/customer-service-full-flow.test.mjs test/agent-delete-ui-contract.test.mjs test/admin-browser-smoke.spec.mjs

      - name: Restore normal CI configuration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm .github/workflows/agent-delete-diagnostic.yml

      - name: Repository guardrails
        run: pnpm guardrails

      - name: Format
        run: pnpm format

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ali Lee"
          git config user.email "fcqz121314@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(admin): restore agent deletion"
          git push origin HEAD:fix/restore-agent-delete
