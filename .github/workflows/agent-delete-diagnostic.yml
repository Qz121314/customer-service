name: Agent Delete Diagnostic

on:
  push:
    branches: [fix/restore-agent-delete]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore staged agent deletion changes
        shell: bash
        run: |
          set -euo pipefail
          payload="$(sed -n "35s/.*echo '\([^']*\)'.*/\1/p" .github/workflows/ci.yml)"
          test -n "$payload"
          printf '%s' "$payload" | base64 -d | gzip -d > /tmp/restore-agent-delete.py
          python /tmp/restore-agent-delete.py

      - name: Show generated delete wiring
        shell: bash
        run: |
          set -euo pipefail
          echo '--- AdminPortal lines 645-690 ---'
          nl -ba src/dashboard/AdminPortal.tsx | sed -n '645,690p'
          echo '--- delete-related matches ---'
          grep -n -C 5 -E 'deleteAgent|deletingAgent|removeAgent|删除客服|删除中' src/dashboard/AdminPortal.tsx || true

      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          echo "$status" > /tmp/typecheck-status.txt
          exit 0

      - name: Upload typecheck diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: agent-delete-typecheck
          path: |
            /tmp/typecheck.log
            /tmp/typecheck-status.txt
            src/dashboard/AdminPortal.tsx
          if-no-files-found: error
