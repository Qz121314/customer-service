name: Agent Delete Diagnostic

on:
  push:
    branches: [fix/restore-agent-delete]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore staged agent deletion changes
        shell: bash
        run: |
          set -euo pipefail
          payload="$(sed -n "35s/.*echo '\([^']*\)'.*/\1/p" .github/workflows/ci.yml)"
          test -n "$payload"
          printf '%s' "$payload" | base64 -d | gzip -d > /tmp/restore-agent-delete.py
          python /tmp/restore-agent-delete.py

      - name: Fix stable agent id capture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/dashboard/AdminPortal.tsx')
          s = p.read_text()
          section_anchor = "  const sectionTitle = section === 'agents' ? '客服坐席' : '流量统计';\n"
          if section_anchor not in s:
              raise SystemExit('missing sectionTitle anchor')
          s = s.replace(
              section_anchor,
              "  const editingAgentId = draft.id;\n" + section_anchor,
              1,
          )
          old = '''          onDelete={
            draft.id
              ? () =>
                  void removeAgent({
                    id: draft.id,
                    name: draft.name,
                  })
              : undefined
          }
'''
          new = '''          onDelete={
            editingAgentId
              ? () =>
                  void removeAgent({
                    id: editingAgentId,
                    name: draft.name,
                  })
              : undefined
          }
'''
          if old not in s:
              raise SystemExit('missing onDelete anchor')
          p.write_text(s.replace(old, new, 1))
          PY
          pnpm exec prettier --write \
            src/dashboard/api.ts \
            src/dashboard/AdminPortal.tsx \
            src/dashboard/AgentEditorModal.tsx \
            src/dashboard/agent-editor.css \
            src/worker/admin-config-api.ts \
            test/customer-service-full-flow.test.mjs \
            test/agent-delete-ui-contract.test.mjs \
            test/admin-browser-smoke.spec.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Upload verified feature files
        uses: actions/upload-artifact@v4
        with:
          name: verified-agent-delete-files
          path: |
            src/dashboard/api.ts
            src/dashboard/AdminPortal.tsx
            src/dashboard/AgentEditorModal.tsx
            src/dashboard/agent-editor.css
            src/worker/admin-config-api.ts
            test/customer-service-full-flow.test.mjs
            test/agent-delete-ui-contract.test.mjs
            test/admin-browser-smoke.spec.mjs
          if-no-files-found: error
