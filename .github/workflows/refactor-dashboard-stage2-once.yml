name: One-time dashboard stage2 extraction

on:
  push:
    branches:
      - agent/dashboard-stage2-components

permissions:
  contents: write

jobs:
  refactor-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Extract stage2 components
        run: node scripts/refactor-dashboard-stage2.mjs
      - name: Format source
        run: pnpm exec prettier --write src/dashboard/AdminPortal.tsx src/dashboard/AgentPortal.tsx src/dashboard/AdminStatisticsModal.tsx src/dashboard/AgentEditorModal.tsx src/dashboard/AgentWorkspacePanels.tsx
      - name: Validate source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Commit validated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/refactor-dashboard-stage2.mjs .github/workflows/refactor-dashboard-stage2-once.yml
          git add src/dashboard/AdminPortal.tsx src/dashboard/AgentPortal.tsx src/dashboard/AdminStatisticsModal.tsx src/dashboard/AgentEditorModal.tsx src/dashboard/AgentWorkspacePanels.tsx
          git commit -m "Extract focused dashboard panels"
          git push origin HEAD:agent/dashboard-stage2-components
