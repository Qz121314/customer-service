name: Wire realtime admin inbox

on:
  push:
    branches: [feat/site-realtime-bridge]
    paths:
      - .github/workflows/wire-admin-inbox.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/site-realtime-bridge

      - name: Patch realtime inbox
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('src/worker/client-api.ts')
          text = client.read_text()
          text = text.replace("'admin:inbox'", "'admin-inbox'")
          client.write_text(text)

          app = Path('src/dashboard/App.tsx')
          text = app.read_text()
          marker = """  useEffect(() => {\n    if (!selectedId) {\n"""
          insert = """  useEffect(() => {\n    let active = true;\n    let socket: WebSocket | null = null;\n    let reconnectTimer: number | null = null;\n\n    const connect = () => {\n      if (!active) return;\n      socket = openConversationSocket('admin-inbox');\n      socket.addEventListener('message', (event) => {\n        if (!active) return;\n        try {\n          const payload = JSON.parse(String(event.data)) as { type?: string };\n          if (payload.type === 'conversation.changed') void refresh();\n        } catch {\n          // 忽略非 JSON WebSocket 帧。\n        }\n      });\n      socket.addEventListener('close', () => {\n        if (!active) return;\n        reconnectTimer = window.setTimeout(connect, 1000);\n      });\n      socket.addEventListener('error', () => socket?.close());\n    };\n\n    connect();\n    return () => {\n      active = false;\n      socket?.close();\n      if (reconnectTimer !== null) window.clearTimeout(reconnectTimer);\n    };\n  }, [refresh]);\n\n  useEffect(() => {\n    if (!selectedId) {\n"""
          if marker not in text:
              raise SystemExit('Workspace selected conversation effect marker not found')
          app.write_text(text.replace(marker, insert, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec prettier --write src/worker/client-api.ts src/dashboard/App.tsx

      - name: Commit realtime inbox
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker/client-api.ts src/dashboard/App.tsx
          git commit -m 'feat: refresh admin inbox in realtime'
          git push origin HEAD:feat/site-realtime-bridge
