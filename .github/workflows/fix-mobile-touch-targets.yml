name: Apply mobile touch target fix

on:
  push:
    branches: [ui/agent-mobile-inbox-redesign]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/agent-mobile-inbox-redesign
      - name: Patch compact mobile touch targets
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('src/dashboard/agent-mobile.css')
          css = css_path.read_text()
          replacements = {
              'grid-template-columns: repeat(5, 30px);': 'grid-template-columns: repeat(5, 34px);',
              '    width: 30px;\n    min-width: 30px;\n    height: 30px;\n    min-height: 30px;': '    width: 34px;\n    min-width: 34px;\n    height: 34px;\n    min-height: 34px;',
              '    grid-template-columns: 32px minmax(0, 1fr);': '    grid-template-columns: 34px minmax(0, 1fr);',
              '    width: 32px;\n    min-width: 32px;\n    height: 32px;\n    min-height: 32px;': '    width: 34px;\n    min-width: 34px;\n    height: 34px;\n    min-height: 34px;',
              '    left: 23px;': '    left: 25px;',
              'grid-template-columns: repeat(5, 28px);': 'grid-template-columns: repeat(5, 34px);',
              '    width: 28px;\n    min-width: 28px;\n    height: 28px;\n    min-height: 28px;': '    width: 34px;\n    min-width: 34px;\n    height: 34px;\n    min-height: 34px;',
          }
          for old, new in replacements.items():
              if old not in css:
                  raise SystemExit(f'missing CSS contract: {old!r}')
              css = css.replace(old, new, 1)
          css_path.write_text(css)

          test_path = Path('test/agent-mobile-inbox-compact-contract.test.mjs')
          test = test_path.read_text()
          test = test.replace('repeat\\(5, 30px\\)', 'repeat\\(5, 34px\\)')
          test = test.replace('repeat\\(5, 28px\\)', 'repeat\\(5, 34px\\)')
          marker = "  assert.match(\n    narrow,\n    /\\.workspace-sidebar-actions \\{[^}]*grid-template-columns: repeat\\(5, 34px\\);/s,\n  );\n"
          if marker not in test:
              raise SystemExit('missing narrow toolbar contract')
          avatar_contract = "  assert.match(\n    narrow,\n    /\\.agent-profile \\.agent-avatar-button \\{[^}]*width: 34px;[^}]*min-width: 34px;[^}]*height: 34px;[^}]*min-height: 34px;/s,\n  );\n"
          test = test.replace(marker, marker + avatar_contract, 1)
          test_path.write_text(test)

          workflow = Path('.github/workflows/fix-mobile-touch-targets.yml')
          workflow.unlink()
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/dashboard/agent-mobile.css test/agent-mobile-inbox-compact-contract.test.mjs .github/workflows/fix-mobile-touch-targets.yml
          git commit -m "fix: preserve compact mobile touch targets"
          git push origin HEAD:ui/agent-mobile-inbox-redesign
