name: One-shot format agent mobile inbox contract

on:
  push:
    branches: [ui/agent-mobile-inbox-redesign]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/agent-mobile-inbox-redesign
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write test/agent-mobile-inbox-compact-contract.test.mjs
      - name: Commit formatted contract and remove helper
        shell: bash
        run: |
          rm .github/workflows/one-shot-format-agent-mobile-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Format agent mobile inbox contract'
          git push origin HEAD:ui/agent-mobile-inbox-redesign
