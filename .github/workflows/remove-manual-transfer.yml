name: Remove manual transfer implementation

on:
  push:
    branches:
      - chore/final-remove-manual-transfer

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove manual transfer implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          thread_path = Path('src/dashboard/agent-thread.css')
          thread = thread_path.read_text(encoding='utf-8')
          hide_rule = ".workspace-shell .transfer-menu {\n  display: none !important;\n}\n\n"
          if thread.count(hide_rule) != 1:
              raise SystemExit('Expected the obsolete transfer hide rule exactly once.')
          thread_path.write_text(thread.replace(hide_rule, ''), encoding='utf-8')

          script_path = Path('scripts/remove-manual-transfer.py')
          script = script_path.read_text(encoding='utf-8')
          start = script.index('def remove_css_rules_with_token')
          end = script.index('\n\n# Agent workspace', start)
          helper = '''def remove_css_rules_with_token(text: str, token: str) -> str:
              while token in text:
                  token_at = text.index(token)
                  open_at = text.find("{", token_at)
                  if open_at < 0:
                      raise RuntimeError(f"CSS token {token!r} has no rule block")
                  previous_close = text.rfind("}", 0, token_at)
                  previous_open = text.rfind("{", 0, token_at)
                  selector_start = max(previous_close, previous_open) + 1
                  comment_end = text.rfind("*/", selector_start, open_at)
                  if comment_end >= selector_start:
                      selector_start = comment_end + 2
                  prelude = text[selector_start:open_at].strip()
                  selectors = [part.strip() for part in prelude.split(",") if part.strip()]
                  if not selectors:
                      raise RuntimeError(f"CSS token {token!r} has no selectors")
                  kept = [selector for selector in selectors if token not in selector]
                  removed = [selector for selector in selectors if token in selector]
                  if not removed:
                      raise RuntimeError(f"CSS token {token!r} was not found in parsed selectors")
                  depth = 0
                  close_at = None
                  for index in range(open_at, len(text)):
                      char = text[index]
                      if char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              close_at = index + 1
                              break
                  if close_at is None:
                      raise RuntimeError(f"Unbalanced CSS rule containing {token!r}")
                  if kept:
                      replacement = ("," + chr(10)).join(kept) + " "
                      text = text[:selector_start] + replacement + text[open_at:]
                      continue
                  while close_at < len(text) and text[close_at] in " \\t":
                      close_at += 1
                  if close_at < len(text) and text[close_at] == chr(10):
                      close_at += 1
                  text = text[:selector_start] + text[close_at:]
              return text
          '''
          script = script[:start] + helper + script[end:]
          script = script.replace(
              'roots = [ROOT / "src", ROOT / "test", ROOT / "scripts", ROOT / "docs", ROOT / "public"]',
              'roots = [ROOT / "src", ROOT / "scripts", ROOT / "public"]',
          )
          script = script.replace(
              'extra = [ROOT / "README.md", ROOT / "AGENTS.md"]',
              'extra = []',
          )
          script = script.replace('    "转接",' + chr(10), '')
          script_path.write_text(script, encoding='utf-8')
          PY
          python3 scripts/remove-manual-transfer.py

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format cleanup
        run: pnpm exec prettier --write src test migrations

      - name: Verify runtime transfer implementation is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'transferConversation|TransferTarget|transferTargets|conversation\.transferred|transfer-menu|INVALID_TRANSFER_TARGET|TRANSFER_TARGET_UNAVAILABLE|assignedConversationForTransfer|loadTransferTargets|handoffConversation|requeue_excluded_agent_id|excludedAgentId|/transfer' src scripts public; then
            echo 'Manual transfer runtime residue remains.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: fully remove manual transfer implementation'
          git push origin HEAD:chore/final-remove-manual-transfer
