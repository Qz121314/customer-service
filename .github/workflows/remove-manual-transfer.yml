name: Remove manual transfer implementation

on:
  push:
    branches:
      - chore/final-remove-manual-transfer

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove manual transfer implementation
        run: python3 scripts/remove-manual-transfer.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format cleanup
        run: pnpm exec prettier --write src test migrations

      - name: Verify transfer residue is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'transferConversation|TransferTarget|transferTargets|conversation\.transferred|transfer-menu|INVALID_TRANSFER_TARGET|TRANSFER_TARGET_UNAVAILABLE|assignedConversationForTransfer|loadTransferTargets|handoffConversation|requeue_excluded_agent_id|excludedAgentId|/transfer|转接' src test scripts docs public README.md AGENTS.md; then
            echo 'Manual transfer residue remains.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: fully remove manual transfer implementation'
          git push origin HEAD:chore/final-remove-manual-transfer
