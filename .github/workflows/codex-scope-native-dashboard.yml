name: Codex scope-native dashboard

on:
  push:
    branches: [codex/scope-native-dashboard-20260815]

permissions:
  contents: write

concurrency:
  group: codex-customer-service-scope-native-dashboard
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/scope-native-dashboard-20260815
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Apply scope-native dashboard
        run: |
          python .github/scripts/fix_scope_native_patch.py
          python .github/scripts/apply_scope_native_dashboard.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm format:write
      - name: Verify project
        run: pnpm verify
      - name: Commit verified dashboard refactor
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-scope-native-dashboard.yml .github/scripts/apply_scope_native_dashboard.py .github/scripts/fix_scope_native_patch.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'perf: keep agent routing scopes rule-native in dashboard'
          git push origin HEAD:codex/scope-native-dashboard-20260815
