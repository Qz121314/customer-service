name: Format statistics branch

on:
  push:
    branches:
      - codex/admin-statistics-single-screen-20260824

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format statistics files
        run: pnpm exec prettier --write src/dashboard/AdminStatisticsPage.tsx src/dashboard/admin-statistics-layout.css

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/AdminStatisticsPage.tsx src/dashboard/admin-statistics-layout.css
          git commit -m "Format statistics workspace"
          git push origin HEAD:codex/admin-statistics-single-screen-20260824
