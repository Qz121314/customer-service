name: One-time Prettier Probe

on:
  push:
    branches:
      - agent/push-media-hot-path-d1
    paths:
      - .github/workflows/one-time-prettier-probe.yml

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          pnpm exec prettier --write src/worker/media-store.ts
          git diff -- src/worker/media-store.ts
