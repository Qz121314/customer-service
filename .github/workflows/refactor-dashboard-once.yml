name: One-time dashboard split

on:
  push:
    branches:
      - agent/split-dashboard-app

permissions:
  contents: write

jobs:
  split-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Split dashboard source
        run: node scripts/refactor-dashboard-app.mjs

      - name: Format generated source
        run: pnpm exec prettier --write src/dashboard/App.tsx src/dashboard/AdminPortal.tsx src/dashboard/AgentPortal.tsx src/dashboard/dashboard-shared.tsx

      - name: Validate generated source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Commit generated split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/App.tsx src/dashboard/AdminPortal.tsx src/dashboard/AgentPortal.tsx src/dashboard/dashboard-shared.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Split dashboard application modules"
          git push origin HEAD:agent/split-dashboard-app
