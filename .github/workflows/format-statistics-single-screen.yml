name: Format statistics single screen

on:
  push:
    branches:
      - ui/statistics-single-screen

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui/statistics-single-screen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: |
          pnpm exec prettier --write \
            src/dashboard/admin-statistics-layout.css \
            test/admin-statistics-browser-smoke.spec.mjs \
            .github/workflows/ci.yml

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-statistics-single-screen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/dashboard/admin-statistics-layout.css \
            test/admin-statistics-browser-smoke.spec.mjs \
            .github/workflows/ci.yml \
            .github/workflows/format-statistics-single-screen.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format single-screen statistics changes"
          git push origin HEAD:ui/statistics-single-screen
