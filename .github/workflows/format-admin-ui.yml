name: Format admin UI artifact

on:
  push:
    branches: [agent/admin-form-polish]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/admin-form-polish

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format admin UI files
        run: pnpm exec prettier --write src/dashboard/AgentEditorModal.tsx src/dashboard/product-assignment.css

      - name: Commit formatted admin UI
        shell: bash
        run: |
          set -euo pipefail
          git add src/dashboard/AgentEditorModal.tsx src/dashboard/product-assignment.css
          if git diff --cached --quiet; then
            echo "Admin UI files already match Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format admin UI with locked Prettier"
          git push origin HEAD:agent/admin-form-polish
