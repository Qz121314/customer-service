name: transfer-delta-patch

on:
  push:
    branches: [agent/transfer-realtime-delta]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/transfer-realtime-delta
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply focused patch
        run: |
          python3 .github/scripts/transfer-delta-patch.py
          python3 .github/scripts/transfer-delta-test-contracts.py

      - name: Format changed files
        run: pnpm exec prettier --write src/worker/agent-api.ts src/worker/client-api.ts test/agent-realtime-isolation.test.mjs test/customer-service-full-flow.test.mjs test/message-send-d1-cost.test.mjs test/transfer-realtime-cost.test.mjs

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with captured output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-delta-test-output
          path: test-output.log

      - name: Fail after preserving test output
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Commit validated patch and remove temporary tooling
        run: |
          rm -f test-output.log
          rm .github/workflows/transfer-delta-patch.yml
          rm .github/scripts/transfer-delta-patch.py
          rm .github/scripts/transfer-delta-test-contracts.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use realtime deltas for transfers"
          git push origin HEAD:agent/transfer-realtime-delta
