name: transfer-delta-patch

on:
  push:
    branches: [agent/transfer-realtime-delta]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/transfer-realtime-delta
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply focused patch
        run: python3 .github/scripts/transfer-delta-patch.py

      - name: Format changed files
        run: pnpm exec prettier --write src/worker/agent-api.ts src/worker/client-api.ts test/transfer-realtime-cost.test.mjs

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Commit validated patch and remove temporary tooling
        run: |
          rm .github/workflows/transfer-delta-patch.yml
          rm .github/scripts/transfer-delta-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use realtime deltas for transfers"
          git push origin HEAD:agent/transfer-realtime-delta
