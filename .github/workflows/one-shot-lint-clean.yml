name: One-shot lint clean
on:
  push:
    branches: [ui-admin-repair]
permissions:
  contents: write
jobs:
  clean:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/worker/admin-config-api.ts')
          s = p.read_text()
          s = re.sub(r"\nfunction toHex\(bytes: Uint8Array\): string \{[\s\S]*?\n\}\n?$", "\n", s, count=1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-lint-clean.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove stale credential helper"
          git push
