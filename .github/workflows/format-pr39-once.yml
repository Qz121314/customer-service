name: One-time format reporting retention tests

on:
  push:
    branches:
      - agent/move-reporting-retention-off-hot-path

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/move-reporting-retention-off-hot-path
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format tests
        run: pnpm exec prettier --write test/conversation-retention.test.mjs test/reporting-retention-cost.test.mjs
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/format-pr39-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/conversation-retention.test.mjs test/reporting-retention-cost.test.mjs .github/workflows/format-pr39-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format reporting retention tests"
          git push origin HEAD:agent/move-reporting-retention-off-hot-path
