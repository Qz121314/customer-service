name: Temporary diagnose quota ledger tests

on:
  push:
    branches:
      - reliability/quota-ledger-reconciliation
    paths-ignore:
      - diagnostic-quota-ledger-test.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run full tests
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/test.log 2>&1
          status=$?
          {
            echo "exit=$status"
            grep -E -A16 -B8 'not ok|AssertionError|ERR_|failureType|actual:|expected:|Error' /tmp/test.log | tail -n 320
          } > diagnostic-quota-ledger-test.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-quota-ledger-test.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Capture quota ledger test failure"
          git push origin HEAD:reliability/quota-ledger-reconciliation
