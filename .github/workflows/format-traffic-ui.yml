name: Format traffic statistics branch

on:
  push:
    branches:
      - ui/admin-traffic-statistics-refresh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed statistics files
        run: pnpm exec prettier --write src/dashboard/AdminStatisticsPage.tsx src/dashboard/admin-statistics.css

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/AdminStatisticsPage.tsx src/dashboard/admin-statistics.css
          git commit -m "style: apply prettier to traffic statistics UI"
          git push origin HEAD:${GITHUB_REF_NAME}
