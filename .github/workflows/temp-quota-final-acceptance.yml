name: Temporary quota acceptance patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acceptance/quota-final-e2e
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch from previous workflow revision
        shell: bash
        run: |
          git show HEAD^:.github/workflows/temp-quota-final-acceptance.yml > /tmp/quota-patch.yml
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          text = Path('/tmp/quota-patch.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          code = dedent(text[start:end])
          exec(compile(code, '<quota-acceptance-patch>', 'exec'))
          PY
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format patched files
        run: pnpm exec prettier --write src/worker/agent-api.ts test/customer-service-full-flow.test.mjs
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/temp-quota-final-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/agent-api.ts test/customer-service-full-flow.test.mjs .github/workflows/temp-quota-final-acceptance.yml
          git commit -m "Add final quota lifecycle acceptance coverage"
          git push origin HEAD:acceptance/quota-final-e2e
