name: Temporary quota acceptance patch

on:
  push:
    branches:
      - acceptance/quota-final-e2e

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply acceptance changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          agent_path = Path('src/worker/agent-api.ts')
          agent = agent_path.read_text()
          old_targets = '''async function loadTransferTargets(db: D1Database, agentId: string) {
            const businessDate = routingBusinessDate();
            const result = await db
              .prepare(
                `SELECT a.id, a.name, a.status, a.max_active_conversations,
                   COUNT(load.id) AS active_count
                 FROM agents current
                 JOIN agents a ON a.site_id = current.site_id AND a.id <> current.id
                 LEFT JOIN conversations load
                   ON load.assigned_agent = a.id
                  AND load.status IN ('open', 'pending')
                  AND COALESCE(load.expires_at, datetime(load.created_at, '+1 day')) > CURRENT_TIMESTAMP
                 LEFT JOIN agent_daily_stats daily
                   ON daily.site_id = a.site_id
                  AND daily.agent_id = a.id
                  AND daily.business_date = ?2
                 WHERE current.id = ?1
                   AND a.is_enabled = 1
                   AND a.status = 'online'
                   AND a.username IS NOT NULL
                   AND a.password_hash IS NOT NULL
                   AND a.last_seen_at IS NOT NULL
                   AND datetime(a.last_seen_at) >= datetime('now', '-2 minutes')
                   AND (
                     a.daily_conversation_limit = 0
                     OR COALESCE(daily.conversation_count, 0) < a.daily_conversation_limit
                   )
                   AND (
                     a.traffic_quota_enabled = 0
                     OR a.traffic_quota_used < a.traffic_quota_total
                   )
                 GROUP BY a.id, a.name, a.status, a.max_active_conversations
                 HAVING (
                   a.max_active_conversations = 0
                   OR COUNT(load.id) < a.max_active_conversations
                 )
                 ORDER BY COUNT(load.id) ASC, a.name ASC, a.id ASC`,
              )
              .bind(agentId, businessDate)
              .all<TransferTargetRow>();
            return result.results ?? [];
          }
          '''
          new_targets = '''async function loadTransferTargets(db: D1Database, agentId: string) {
            const result = await db
              .prepare(
                `SELECT a.id, a.name, a.status, a.max_active_conversations,
                   COUNT(load.id) AS active_count
                 FROM agents current
                 JOIN agents a ON a.site_id = current.site_id AND a.id <> current.id
                 LEFT JOIN conversations load
                   ON load.assigned_agent = a.id
                  AND load.status IN ('open', 'pending')
                  AND COALESCE(load.expires_at, datetime(load.created_at, '+1 day')) > CURRENT_TIMESTAMP
                 WHERE current.id = ?1
                   AND a.is_enabled = 1
                   AND a.status = 'online'
                   AND a.username IS NOT NULL
                   AND a.password_hash IS NOT NULL
                   AND a.last_seen_at IS NOT NULL
                   AND datetime(a.last_seen_at) >= datetime('now', '-2 minutes')
                 GROUP BY a.id, a.name, a.status, a.max_active_conversations
                 HAVING (
                   a.max_active_conversations = 0
                   OR COUNT(load.id) < a.max_active_conversations
                 )
                 ORDER BY COUNT(load.id) ASC, a.name ASC, a.id ASC`,
              )
              .bind(agentId)
              .all<TransferTargetRow>();
            return result.results ?? [];
          }
          '''
          if old_targets not in agent:
              raise SystemExit('loadTransferTargets block not found')
          agent = agent.replace(old_targets, new_targets, 1)

          old_transfer_limits = '''             AND (
               target.daily_conversation_limit = 0
               OR COALESCE(daily.conversation_count, 0) < target.daily_conversation_limit
             )
             AND (
               target.traffic_quota_enabled = 0
               OR target.traffic_quota_used < target.traffic_quota_total
             )
          '''
          new_transfer_limits = '''             AND (
               EXISTS (
                 SELECT 1
                 FROM agent_traffic_receipts receipt
                 WHERE receipt.conversation_id = ?4
               )
               OR (
                 (
                   target.daily_conversation_limit = 0
                   OR COALESCE(daily.conversation_count, 0) < target.daily_conversation_limit
                 )
                 AND (
                   target.traffic_quota_enabled = 0
                   OR target.traffic_quota_used < target.traffic_quota_total
                 )
               )
             )
          '''
          if old_transfer_limits not in agent:
              raise SystemExit('transfer quota block not found')
          agent = agent.replace(old_transfer_limits, new_transfer_limits, 1)
          agent_path.write_text(agent)

          test_path = Path('test/customer-service-full-flow.test.mjs')
          test = test_path.read_text()
          old_imports = '''let adminConfigApi;
          let agentApi;
          let clientApi;
          let mediaApi;
          try {
            [{ adminConfigApi }, { agentApi }, { clientApi }, { mediaApi }] =
              await Promise.all([
                import('../src/worker/admin-config-api.ts'),
                import('../src/worker/agent-api.ts'),
                import('../src/worker/client-api.ts'),
                import('../src/worker/media-api.ts'),
              ]);
          '''
          new_imports = '''let adminConfigApi;
          let adminQuotaApi;
          let agentApi;
          let clientApi;
          let mediaApi;
          try {
            [
              { adminConfigApi },
              { adminQuotaApi },
              { agentApi },
              { clientApi },
              { mediaApi },
            ] = await Promise.all([
              import('../src/worker/admin-config-api.ts'),
              import('../src/worker/admin-quota-api.ts'),
              import('../src/worker/agent-api.ts'),
              import('../src/worker/client-api.ts'),
              import('../src/worker/media-api.ts'),
            ]);
          '''
          if old_imports not in test:
              raise SystemExit('test import block not found')
          test = test.replace(old_imports, new_imports, 1)

          acceptance = r'''

          test('consultation quota commercial lifecycle remains consistent end to end', async () => {
            const database = new DatabaseSync(':memory:');
            applyMigrations(database);
            const adminPassword = 'admin-password';
            const rooms = fakeRooms();
            const env = {
              DB: d1(database),
              CONVERSATION_ROOMS: rooms.namespace,
              ADMIN_PASSWORD: adminPassword,
            };
            const executionCtx = {
              waitUntil() {},
              passThroughOnException() {},
            };

            async function createSeat({
              name,
              username,
              sectionIds,
              quota,
              dailyLimit,
              requestId,
            }) {
              const response = await adminConfigApi.request(
                '/api/admin/agents',
                {
                  method: 'POST',
                  headers: {
                    cookie: adminCookie(adminPassword),
                    'content-type': 'application/json',
                  },
                  body: JSON.stringify({
                    name,
                    username,
                    password: 'pass',
                    routingScope: { type: 'section', sectionIds },
                    maxActiveConversations: 0,
                    dailyConversationLimit: dailyLimit,
                    trafficQuotaEnabled: true,
                    trafficQuotaTopUp: quota,
                    trafficQuotaRequestId: requestId,
                    isEnabled: true,
                  }),
                },
                env,
              );
              const created = await json(response);
              return created.id;
            }

            const agentA = await createSeat({
              name: 'Quota Agent A',
              username: 'quota-agent-a',
              sectionIds: ['west'],
              quota: 2,
              dailyLimit: 3,
              requestId: 'quota-final-create-a',
            });
            const agentB = await createSeat({
              name: 'Quota Agent B',
              username: 'quota-agent-b',
              sectionIds: ['east', 'west'],
              quota: 1,
              dailyLimit: 1,
              requestId: 'quota-final-create-b',
            });

            const tokenA = 'quota-final-session-a';
            const tokenB = 'quota-final-session-b';
            const expiresAt = new Date(Date.now() + 60 * 60 * 1000).toISOString();
            database
              .prepare(
                `UPDATE agents
                 SET status = 'online', last_seen_at = CURRENT_TIMESTAMP
                 WHERE id IN (?, ?)`,
              )
              .run(agentA, agentB);
            database
              .prepare(
                `INSERT INTO agent_sessions (id, agent_id, token_hash, expires_at)
                 VALUES (?, ?, ?, ?), (?, ?, ?, ?)`,
              )
              .run(
                'quota-final-session-row-a',
                agentA,
                sha256(tokenA),
                expiresAt,
                'quota-final-session-row-b',
                agentB,
                sha256(tokenB),
                expiresAt,
              );

            let handoffIndex = 0;
            async function createConversation(sectionId) {
              handoffIndex += 1;
              const visitorId = `quota-final-visitor-${handoffIndex}`;
              const response = await clientApi.request(
                '/client/v1/conversations',
                {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    visitorId,
                    sourceHandoffId: `quota-final-handoff-${handoffIndex}`,
                    clientMessageId: `quota-final-message-${handoffIndex}`,
                    message: `Quota acceptance ${handoffIndex}`,
                    product: {
                      id: `quota-final-product-${sectionId}-${handoffIndex}`,
                      sectionId,
                      sectionName: sectionId,
                      categoryId: 'quota-test',
                      categoryName: 'Quota test',
                      title: `Quota ${sectionId} ${handoffIndex}`,
                      href: `/quota/${sectionId}/${handoffIndex}`,
                      coverUrl: null,
                    },
                  }),
                },
                env,
              );
              return json(response);
            }

            const east = await createConversation('east');
            const eastId = east.conversation.id;
            assert.equal(
              database
                .prepare('SELECT assigned_agent FROM conversations WHERE id = ?')
                .get(eastId).assigned_agent,
              agentB,
            );
            assert.deepEqual(
              database
                .prepare(
                  `SELECT traffic_quota_total AS total,
                     traffic_quota_used AS used
                   FROM agents WHERE id = ?`,
                )
                .get(agentB),
              { total: 1, used: 1 },
            );

            const westOne = await createConversation('west');
            const westTwo = await createConversation('west');
            const westThree = await createConversation('west');
            const westOneId = westOne.conversation.id;
            const westTwoId = westTwo.conversation.id;
            const westThreeId = westThree.conversation.id;
            assert.equal(
              database
                .prepare('SELECT assigned_agent FROM conversations WHERE id = ?')
                .get(westOneId).assigned_agent,
              agentA,
            );
            assert.equal(
              database
                .prepare('SELECT assigned_agent FROM conversations WHERE id = ?')
                .get(westTwoId).assigned_agent,
              agentA,
            );
            assert.equal(
              database
                .prepare('SELECT assigned_agent FROM conversations WHERE id = ?')
                .get(westThreeId).assigned_agent,
              null,
              'fresh traffic must wait when every matching seat has exhausted new-traffic quota',
            );
            assert.deepEqual(
              database
                .prepare(
                  `SELECT traffic_quota_total AS total,
                     traffic_quota_used AS used
                   FROM agents WHERE id = ?`,
                )
                .get(agentA),
              { total: 2, used: 2 },
            );

            const cookieA = `cs_agent_session=${tokenA}`;
            const cookieB = `cs_agent_session=${tokenB}`;
            const inboxA = await json(
              await agentApi.request(
                '/api/agent/conversations',
                { headers: { cookie: cookieA } },
                env,
              ),
            );
            assert.ok(
              inboxA.transferTargets.some((target) => target.id === agentB),
              'an exhausted seat with spare active capacity must remain a transfer target for already-counted traffic',
            );

            const beforeTransferB = database
              .prepare(
                `SELECT a.traffic_quota_used AS used,
                   COALESCE(SUM(s.conversation_count), 0) AS daily
                 FROM agents a
                 LEFT JOIN agent_daily_stats s ON s.agent_id = a.id
                 WHERE a.id = ?
                 GROUP BY a.id`,
              )
              .get(agentB);
            const transferResponse = await agentApi.fetch(
              new globalThis.Request(
                `https://customer-service.test/api/agent/conversations/${encodeURIComponent(westOneId)}/transfer`,
                {
                  method: 'POST',
                  headers: {
                    cookie: cookieA,
                    'content-type': 'application/json',
                  },
                  body: JSON.stringify({ targetAgentId: agentB }),
                },
              ),
              env,
              executionCtx,
            );
            const transferred = await json(transferResponse);
            assert.equal(transferred.assignment.id, agentB);
            assert.deepEqual(
              database
                .prepare(
                  `SELECT a.traffic_quota_used AS used,
                     COALESCE(SUM(s.conversation_count), 0) AS daily
                   FROM agents a
                   LEFT JOIN agent_daily_stats s ON s.agent_id = a.id
                   WHERE a.id = ?
                   GROUP BY a.id`,
                )
                .get(agentB),
              beforeTransferB,
              'transfer must not consume paid or daily new-traffic quota again',
            );

            const requeueResponse = await agentApi.fetch(
              new globalThis.Request(
                `https://customer-service.test/api/agent/conversations/${encodeURIComponent(westOneId)}/transfer`,
                {
                  method: 'POST',
                  headers: {
                    cookie: cookieB,
                    'content-type': 'application/json',
                  },
                  body: JSON.stringify({ targetAgentId: null }),
                },
              ),
              env,
              executionCtx,
            );
            const requeued = await json(requeueResponse);
            assert.equal(
              requeued.assignment.id,
              agentA,
              'already-counted traffic must recover to a matching exhausted seat without another unit',
            );
            assert.equal(
              database
                .prepare('SELECT traffic_quota_used FROM agents WHERE id = ?')
                .get(agentA).traffic_quota_used,
              2,
            );

            const topUpResponse = await adminConfigApi.request(
              `/api/admin/agents/${encodeURIComponent(agentA)}`,
              {
                method: 'PATCH',
                headers: {
                  cookie: adminCookie(adminPassword),
                  'content-type': 'application/json',
                },
                body: JSON.stringify({
                  trafficQuotaTopUp: 1,
                  trafficQuotaRequestId: 'quota-final-topup-a',
                }),
              },
              env,
              executionCtx,
            );
            const toppedUp = await json(topUpResponse);
            assert.equal(toppedUp.quotaApplied, true);
            assert.equal(toppedUp.assignedWaitingCount, 1);
            assert.equal(
              database
                .prepare('SELECT assigned_agent FROM conversations WHERE id = ?')
                .get(westThreeId).assigned_agent,
              agentA,
              'adding one unit must immediately admit one waiting fresh conversation',
            );
            assert.deepEqual(
              database
                .prepare(
                  `SELECT traffic_quota_total AS total,
                     traffic_quota_used AS used
                   FROM agents WHERE id = ?`,
                )
                .get(agentA),
              { total: 3, used: 3 },
            );

            const disableResponse = await adminConfigApi.request(
              `/api/admin/agents/${encodeURIComponent(agentA)}`,
              {
                method: 'PATCH',
                headers: {
                  cookie: adminCookie(adminPassword),
                  'content-type': 'application/json',
                },
                body: JSON.stringify({ isEnabled: false }),
              },
              env,
            );
            await json(disableResponse);
            assert.deepEqual(
              database
                .prepare(
                  `SELECT id, assigned_agent
                   FROM conversations
                   WHERE id IN (?, ?, ?)
                   ORDER BY id`,
                )
                .all(westOneId, westTwoId, westThreeId)
                .map((row) => row.assigned_agent),
              [agentB, agentB, agentB],
              'disabling a seat must reassign its already-counted active traffic even when the target has no new-traffic quota',
            );
            assert.deepEqual(
              database
                .prepare(
                  `SELECT a.traffic_quota_used AS used,
                     COALESCE(SUM(s.conversation_count), 0) AS daily
                   FROM agents a
                   LEFT JOIN agent_daily_stats s ON s.agent_id = a.id
                   WHERE a.id = ?
                   GROUP BY a.id`,
                )
                .get(agentB),
              beforeTransferB,
              'reassignment after seat disable must not bill the target again',
            );

            assert.deepEqual(
              database
                .prepare(
                  `SELECT agent_id, COUNT(*) AS count
                   FROM agent_traffic_receipts
                   WHERE conversation_id IN (?, ?, ?, ?)
                   GROUP BY agent_id
                   ORDER BY agent_id`,
                )
                .all(eastId, westOneId, westTwoId, westThreeId)
                .map((row) => ({ agentId: row.agent_id, count: row.count })),
              [
                { agentId: agentA, count: 3 },
                { agentId: agentB, count: 1 },
              ].sort((left, right) => left.agentId.localeCompare(right.agentId)),
              'immutable first-reception receipts must remain the billing source of truth after transfers',
            );

            const ledgerA = await json(
              await adminQuotaApi.request(
                `/api/admin/agents/${encodeURIComponent(agentA)}/quota-ledger`,
                { headers: { cookie: adminCookie(adminPassword) } },
                env,
              ),
            );
            assert.deepEqual(
              {
                total: ledgerA.ledger.total,
                used: ledgerA.ledger.used,
                expectedTotal: ledgerA.ledger.expectedTotal,
                expectedUsed: ledgerA.ledger.expectedUsed,
                consistent: ledgerA.ledger.consistent,
              },
              {
                total: 3,
                used: 3,
                expectedTotal: 3,
                expectedUsed: 3,
                consistent: true,
              },
            );
            const ledgerB = await json(
              await adminQuotaApi.request(
                `/api/admin/agents/${encodeURIComponent(agentB)}/quota-ledger`,
                { headers: { cookie: adminCookie(adminPassword) } },
                env,
              ),
            );
            assert.deepEqual(
              {
                total: ledgerB.ledger.total,
                used: ledgerB.ledger.used,
                expectedTotal: ledgerB.ledger.expectedTotal,
                expectedUsed: ledgerB.ledger.expectedUsed,
                consistent: ledgerB.ledger.consistent,
              },
              {
                total: 1,
                used: 1,
                expectedTotal: 1,
                expectedUsed: 1,
                consistent: true,
              },
            );

            database.close();
          });
          '''
          test = test.rstrip() + acceptance + '\n'
          test_path.write_text(test)
          PY
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format patched files
        run: pnpm exec prettier --write src/worker/agent-api.ts test/customer-service-full-flow.test.mjs
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/temp-quota-final-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/agent-api.ts test/customer-service-full-flow.test.mjs .github/workflows/temp-quota-final-acceptance.yml
          git commit -m "Add final quota lifecycle acceptance coverage"
          git push origin HEAD:acceptance/quota-final-e2e
