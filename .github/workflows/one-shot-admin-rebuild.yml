name: One-shot admin rebuild
on:
  push:
    branches: [ui-admin-repair]
permissions:
  contents: write
jobs:
  rebuild:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply rebuild
        run: python3 scripts/admin-rebuild.py
      - name: Format sources
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm format:write
      - name: Remove staging files
        run: rm scripts/admin-rebuild.py .github/workflows/one-shot-admin-rebuild.yml
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: rebuild admin console and agent credential flow"
          git push
