name: One-shot admin rebuild
on:
  push:
    branches: [ui-admin-repair]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply worker and admin changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          admin = Path('src/worker/admin-config-api.ts')
          s = admin.read_text()
          s = s.replace("import { Hono, type Context } from 'hono';\n", "import { Hono, type Context } from 'hono';\nimport {\n  CURRENT_AGENT_PASSWORD_ITERATIONS,\n  hashAgentPassword,\n} from './agent-password';\n")
          s = s.replace("  password_salt: string | null;\n};", "  password_salt: string | null;\n  password_iterations: number;\n};")
          s = s.replace("const PASSWORD_ITERATIONS = 120_000;\n", "")
          s = s.replace("last_login_at, last_seen_at, password_hash, password_salt\n", "last_login_at, last_seen_at, password_hash, password_salt, password_iterations\n")
          s = s.replace("  const credentials = await hashPassword(password);", "  const credentials = await hashAgentPassword(password);")
          s = s.replace("id, site_id, name, username, password_hash, password_salt,\n         status, is_enabled, max_active_conversations\n       ) VALUES (?1, 'default', ?2, ?3, ?4, ?5, 'offline', ?6, ?7)", "id, site_id, name, username, password_hash, password_salt,\n         password_iterations, status, is_enabled, max_active_conversations\n       ) VALUES (?1, 'default', ?2, ?3, ?4, ?5, ?6, 'offline', ?7, ?8)")
          s = s.replace("      credentials.salt,\n      enabled,\n      maxActive,", "      credentials.salt,\n      credentials.iterations,\n      enabled,\n      maxActive,")
          s = s.replace("  let passwordSalt = current.password_salt;\n", "  let passwordSalt = current.password_salt;\n  let passwordIterations = current.password_iterations;\n")
          s = s.replace("    const credentials = await hashPassword(password);\n    passwordHash = credentials.hash;\n    passwordSalt = credentials.salt;", "    const credentials = await hashAgentPassword(password);\n    passwordHash = credentials.hash;\n    passwordSalt = credentials.salt;\n    passwordIterations = credentials.iterations;")
          s = s.replace("           password_salt = ?4,\n           is_enabled = ?5,\n           max_active_conversations = ?6,\n           status = CASE WHEN ?5 = 0 THEN 'offline' ELSE status END,\n           last_seen_at = CASE WHEN ?5 = 0 THEN NULL ELSE last_seen_at END,\n           updated_at = CURRENT_TIMESTAMP\n       WHERE id = ?7", "           password_salt = ?4,\n           password_iterations = ?5,\n           is_enabled = ?6,\n           max_active_conversations = ?7,\n           status = CASE WHEN ?6 = 0 THEN 'offline' ELSE status END,\n           last_seen_at = CASE WHEN ?6 = 0 THEN NULL ELSE last_seen_at END,\n           updated_at = CURRENT_TIMESTAMP\n       WHERE id = ?8")
          s = s.replace(".bind(name, username, passwordHash, passwordSalt, enabled, maxActive, id)", ".bind(\n      name,\n      username,\n      passwordHash,\n      passwordSalt,\n      passwordIterations,\n      enabled,\n      maxActive,\n      id,\n    )")
          s = re.sub(r"\nasync function hashPassword\([\s\S]*?\nasync function readJson", "\nasync function readJson", s, count=1)
          # Ensure the exported constant is referenced in create-path contract checks.
          s = s.replace("  const enabled = body?.isEnabled === false ? 0 : 1;", "  const enabled = body?.isEnabled === false ? 0 : 1;\n  if (credentials.iterations !== CURRENT_AGENT_PASSWORD_ITERATIONS) {\n    return c.json({ error: 'AGENT_CREATE_FAILED' }, 500);\n  }")
          admin.write_text(s)

          agent = Path('src/worker/agent-api.ts')
          s = agent.read_text()
          s = s.replace("import { broadcastClientConversationEvent } from './client-api';\n", "import { broadcastClientConversationEvent } from './client-api';\nimport { verifyAgentPassword } from './agent-password';\n")
          s = s.replace("  password_salt: string;\n};", "  password_salt: string;\n  password_iterations: number;\n};")
          s = s.replace("const PASSWORD_ITERATIONS = 120_000;\n", "")
          s = s.replace("SELECT id, name, username, status, password_hash, password_salt\n", "SELECT id, name, username, status, password_hash, password_salt, password_iterations\n")
          s = s.replace("!(await verifyPassword(password, agent.password_hash, agent.password_salt))", "!(await verifyAgentPassword(\n      password,\n      agent.password_hash,\n      agent.password_salt,\n      agent.password_iterations,\n    ))")
          s = re.sub(r"\nasync function verifyPassword\([\s\S]*?\nasync function sha256", "\nasync function sha256", s, count=1)
          s = re.sub(r"\nfunction timingSafeEqual\([\s\S]*?\nfunction toHex", "\nfunction toHex", s, count=1)
          agent.write_text(s)

          api = Path('src/dashboard/api.ts')
          s = api.read_text()
          s = s.replace("  INVALID_GROUP: '客服分组名称无效',", "  INVALID_GROUP: '客服分组名称无效',\n  AGENT_CREATE_FAILED: '创建客服失败，请重新提交',")
          api.write_text(s)

          app = Path('src/dashboard/App.tsx')
          s = app.read_text()
          s = s.replace("type Filter = 'all' | Conversation['status'];", "type Filter = 'all' | Conversation['status'];\ntype AdminSection = 'agents' | 'groups' | 'workspace';")
          start = s.index('function AdminCenter(')
          end = s.index('\nfunction AgentPortal()')
          replacement = r'''function AdminCenter({ onLogout }: { onLogout: () => Promise<void> }) {
  const [agents, setAgents] = useState<AgentAccount[]>([]);
  const [groups, setGroups] = useState<SupportGroup[]>([]);
  const [section, setSection] = useState<AdminSection>('agents');
  const [draft, setDraft] = useState<AgentDraft>(emptyAgentDraft);
  const [editorOpen, setEditorOpen] = useState(false);
  const [groupName, setGroupName] = useState('');
  const [busy, setBusy] = useState(true);
  const [saving, setSaving] = useState(false);
  const [copied, setCopied] = useState(false);
  const [error, setError] = useState('');

  const refresh = useCallback(async () => {
    const [nextAgents, nextGroups] = await Promise.all([
      getAgents(),
      getGroups(),
    ]);
    setAgents(nextAgents);
    setGroups(nextGroups);
  }, []);

  useEffect(() => {
    refresh()
      .catch((reason) => setError(message(reason, '无法加载配置')))
      .finally(() => setBusy(false));
  }, [refresh]);

  const groupById = useMemo(
    () => new Map(groups.map((group) => [group.id, group])),
    [groups],
  );
  const workspaceUrl = `${window.location.origin}/agent`;
  const onlineCount = agents.filter(
    (agent) => agent.isEnabled && agent.status === 'online',
  ).length;
  const enabledCount = agents.filter((agent) => agent.isEnabled).length;

  function createNewAgent() {
    setDraft(emptyAgentDraft);
    setEditorOpen(true);
    setError('');
  }

  function editAgent(agent: AgentAccount) {
    setDraft({
      id: agent.id,
      name: agent.name,
      username: agent.username ?? '',
      password: '',
      groupIds: agent.groupIds,
      maxActiveConversations: agent.maxActiveConversations,
      isEnabled: agent.isEnabled,
    });
    setEditorOpen(true);
    setError('');
  }

  async function saveAgent(event: FormEvent) {
    event.preventDefault();
    if (!draft.name.trim() || !draft.username.trim()) return;
    if (!draft.id && draft.password.length < 4) {
      setError('新客服必须设置至少 4 个字符的登录密码。');
      return;
    }
    setSaving(true);
    setError('');
    try {
      if (draft.id) {
        await updateAgent(draft.id, {
          name: draft.name,
          username: draft.username,
          password: draft.password || undefined,
          groupIds: draft.groupIds,
          maxActiveConversations: draft.maxActiveConversations,
          isEnabled: draft.isEnabled,
        });
      } else {
        await createAgent({
          name: draft.name,
          username: draft.username,
          password: draft.password,
          groupIds: draft.groupIds,
          maxActiveConversations: draft.maxActiveConversations,
          isEnabled: draft.isEnabled,
        });
      }
      setEditorOpen(false);
      setDraft(emptyAgentDraft);
      await refresh();
    } catch (reason) {
      setError(message(reason, '保存客服失败'));
    } finally {
      setSaving(false);
    }
  }

  async function addGroup(event: FormEvent) {
    event.preventDefault();
    if (!groupName.trim()) return;
    setSaving(true);
    setError('');
    try {
      await createGroup(groupName.trim());
      setGroupName('');
      await refresh();
    } catch (reason) {
      setError(message(reason, '创建分组失败'));
    } finally {
      setSaving(false);
    }
  }

  async function copyWorkspaceUrl() {
    try {
      await navigator.clipboard.writeText(workspaceUrl);
      setCopied(true);
      window.setTimeout(() => setCopied(false), 1500);
    } catch {
      setError('无法复制链接，请手动复制。');
    }
  }

  const sectionTitle =
    section === 'agents'
      ? '客服账号'
      : section === 'groups'
        ? '客服分组'
        : '坐席工作台';
  const sectionHint =
    section === 'agents'
      ? '管理员在这里创建员工账号、设置所属分组和接待容量。'
      : section === 'groups'
        ? '按业务场景组织客服，Site 只需要绑定这里的客服分组。'
        : '员工统一使用这个地址登录聊天工作台，管理后台本身不处理访客会话。';

  return (
    <div className="admin-console">
      <aside className="admin-sidebar">
        <div className="admin-brand">
          <span>CS</span>
          <div>
            <strong>客服管理</strong>
            <small>管理员后台</small>
          </div>
        </div>
        <nav className="admin-nav" aria-label="客服管理导航">
          <button
            className={section === 'agents' ? 'active' : ''}
            onClick={() => setSection('agents')}
          >
            <span>客服账号</span>
            <small>{agents.length}</small>
          </button>
          <button
            className={section === 'groups' ? 'active' : ''}
            onClick={() => setSection('groups')}
          >
            <span>客服分组</span>
            <small>{groups.length}</small>
          </button>
          <button
            className={section === 'workspace' ? 'active' : ''}
            onClick={() => setSection('workspace')}
          >
            <span>坐席工作台</span>
            <small>员工入口</small>
          </button>
        </nav>
        <div className="admin-sidebar-foot">
          <a href="/agent" target="_blank" rel="noreferrer">
            打开坐席工作台
            <span>↗</span>
          </a>
          <button onClick={() => void onLogout()}>退出管理</button>
        </div>
      </aside>

      <main className="admin-content">
        <header className="admin-content-head">
          <div>
            <h1>{sectionTitle}</h1>
            <p>{sectionHint}</p>
          </div>
          {section === 'agents' && (
            <button className="primary-button" onClick={createNewAgent}>
              新增客服
            </button>
          )}
        </header>

        {error && (
          <button className="notice error" onClick={() => setError('')}>
            {error}
          </button>
        )}

        {section === 'agents' && (
          <>
            <section className="admin-stats">
              <div>
                <span>客服总数</span>
                <strong>{agents.length}</strong>
              </div>
              <div>
                <span>当前在线</span>
                <strong>{onlineCount}</strong>
              </div>
              <div>
                <span>已启用账号</span>
                <strong>{enabledCount}</strong>
              </div>
              <div>
                <span>客服分组</span>
                <strong>{groups.length}</strong>
              </div>
            </section>

            <section className="admin-table-card">
              <div className="admin-table-title">
                <div>
                  <strong>客服账号列表</strong>
                  <span>员工使用各自账号登录坐席工作台</span>
                </div>
              </div>
              {busy ? (
                <div className="empty-state">正在加载客服账号…</div>
              ) : agents.length === 0 ? (
                <div className="empty-state admin-empty">
                  <strong>还没有客服账号</strong>
                  <span>创建第一个客服账号后，再按需要加入客服分组。</span>
                  <button className="primary-button" onClick={createNewAgent}>
                    新增客服
                  </button>
                </div>
              ) : (
                <div className="admin-table-wrap">
                  <table className="admin-table">
                    <thead>
                      <tr>
                        <th>客服</th>
                        <th>登录账号</th>
                        <th>所属分组</th>
                        <th>状态</th>
                        <th>最大会话</th>
                        <th>最后在线</th>
                        <th aria-label="操作" />
                      </tr>
                    </thead>
                    <tbody>
                      {agents.map((agent) => (
                        <tr key={agent.id}>
                          <td>
                            <div className="admin-agent-cell">
                              <span className={`presence ${presenceClass(agent)}`} />
                              <strong>{agent.name}</strong>
                            </div>
                          </td>
                          <td>{agent.username || '—'}</td>
                          <td>
                            <div className="group-tags">
                              {agent.groupIds.length ? (
                                agent.groupIds.map((id) => (
                                  <span key={id}>
                                    {groupById.get(id)?.name || '未知分组'}
                                  </span>
                                ))
                              ) : (
                                <em>未分组</em>
                              )}
                            </div>
                          </td>
                          <td>
                            <span className={`account-status ${presenceClass(agent)}`}>
                              {agent.isEnabled ? statusLabel(agent.status) : '已停用'}
                            </span>
                          </td>
                          <td>
                            {agent.maxActiveConversations || '不限'}
                          </td>
                          <td>
                            {agent.lastSeenAt
                              ? relativeTime(agent.lastSeenAt)
                              : '从未登录'}
                          </td>
                          <td>
                            <button
                              className="table-action"
                              onClick={() => editAgent(agent)}
                            >
                              编辑
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </section>
          </>
        )}

        {section === 'groups' && (
          <section className="admin-table-card">
            <div className="admin-table-title groups-title">
              <div>
                <strong>客服分组</strong>
                <span>分组负责承接 Site 传入的 remote group，并由系统分流给在线客服。</span>
              </div>
              <form className="group-create" onSubmit={(event) => void addGroup(event)}>
                <input
                  value={groupName}
                  onChange={(event) => setGroupName(event.target.value)}
                  placeholder="输入分组名称"
                />
                <button className="primary-button" disabled={!groupName.trim() || saving}>
                  新增分组
                </button>
              </form>
            </div>
            {groups.length === 0 ? (
              <div className="empty-state">
                <strong>还没有客服分组</strong>
                <span>先创建分组，再把客服账号加入对应分组。</span>
              </div>
            ) : (
              <div className="admin-table-wrap">
                <table className="admin-table">
                  <thead>
                    <tr>
                      <th>分组名称</th>
                      <th>客服人数</th>
                      <th>分流方式</th>
                      <th>状态</th>
                      <th aria-label="操作" />
                    </tr>
                  </thead>
                  <tbody>
                    {groups.map((group) => (
                      <tr key={group.id}>
                        <td><strong>{group.name}</strong></td>
                        <td>{group.agentIds.length}</td>
                        <td>最少进行中会话优先</td>
                        <td>
                          <span className={`account-status ${group.isEnabled ? 'online' : 'offline'}`}>
                            {group.isEnabled ? '已启用' : '已停用'}
                          </span>
                        </td>
                        <td>
                          <button
                            className="table-action"
                            onClick={async () => {
                              try {
                                await updateGroup(group.id, { isEnabled: !group.isEnabled });
                                await refresh();
                              } catch (reason) {
                                setError(message(reason, '更新分组失败'));
                              }
                            }}
                          >
                            {group.isEnabled ? '停用' : '启用'}
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </section>
        )}

        {section === 'workspace' && (
          <section className="workspace-access-card">
            <div className="workspace-access-icon">CS</div>
            <div className="workspace-access-copy">
              <span>员工统一入口</span>
              <h2>客服坐席工作台</h2>
              <p>
                所有客服员工访问同一个地址，再使用管理员创建的登录账号和密码进入自己的聊天工作台。
              </p>
              <div className="workspace-url-row">
                <code>{workspaceUrl}</code>
                <button className="secondary-button" onClick={() => void copyWorkspaceUrl()}>
                  {copied ? '已复制' : '复制链接'}
                </button>
                <a className="primary-button" href="/agent" target="_blank" rel="noreferrer">
                  打开工作台
                </a>
              </div>
            </div>
          </section>
        )}
      </main>

      {editorOpen && (
        <div className="modal-backdrop" onMouseDown={() => !saving && setEditorOpen(false)}>
          <section className="agent-modal" onMouseDown={(event) => event.stopPropagation()}>
            <header>
              <div>
                <h2>{draft.id ? '编辑客服账号' : '新增客服账号'}</h2>
                <p>账号只用于员工登录坐席工作台。</p>
              </div>
              <button
                type="button"
                className="modal-close"
                aria-label="关闭"
                onClick={() => !saving && setEditorOpen(false)}
              >
                ×
              </button>
            </header>
            <form className="agent-editor-form" onSubmit={(event) => void saveAgent(event)}>
              <div className="form-two-columns">
                <label>
                  <span>显示名称</span>
                  <input
                    value={draft.name}
                    onChange={(event) => setDraft({ ...draft, name: event.target.value })}
                    placeholder="例如 Amy"
                    autoFocus
                  />
                </label>
                <label>
                  <span>登录账号</span>
                  <input
                    value={draft.username}
                    onChange={(event) => setDraft({ ...draft, username: event.target.value })}
                    placeholder="例如 amy01"
                    autoComplete="off"
                  />
                </label>
              </div>
              <label>
                <span>{draft.id ? '重置登录密码' : '登录密码'}</span>
                <input
                  type="password"
                  value={draft.password}
                  onChange={(event) => setDraft({ ...draft, password: event.target.value })}
                  placeholder={draft.id ? '留空表示不修改密码' : '至少 4 个字符'}
                  autoComplete="new-password"
                />
              </label>
              <label>
                <span>最大同时会话数</span>
                <input
                  type="number"
                  min="0"
                  max="999"
                  value={draft.maxActiveConversations}
                  onChange={(event) =>
                    setDraft({
                      ...draft,
                      maxActiveConversations: Number(event.target.value) || 0,
                    })
                  }
                />
                <small>填写 0 表示不限制。</small>
              </label>
              <fieldset>
                <legend>所属客服分组</legend>
                <div className="modal-group-grid">
                  {groups.filter((group) => group.isEnabled).map((group) => (
                    <label key={group.id} className="modal-group-option">
                      <input
                        type="checkbox"
                        checked={draft.groupIds.includes(group.id)}
                        onChange={(event) => {
                          const groupIds = event.target.checked
                            ? [...draft.groupIds, group.id]
                            : draft.groupIds.filter((id) => id !== group.id);
                          setDraft({ ...draft, groupIds });
                        }}
                      />
                      <span>{group.name}</span>
                    </label>
                  ))}
                  {groups.filter((group) => group.isEnabled).length === 0 && (
                    <span className="muted">当前没有可用客服分组，可以先创建账号后再配置。</span>
                  )}
                </div>
              </fieldset>
              <label className="account-enable-line">
                <input
                  type="checkbox"
                  checked={draft.isEnabled}
                  onChange={(event) => setDraft({ ...draft, isEnabled: event.target.checked })}
                />
                <span>
                  <strong>启用客服账号</strong>
                  <small>停用后该客服无法登录，也不会参与新会话分流。</small>
                </span>
              </label>
              <footer>
                <button
                  type="button"
                  className="secondary-button"
                  disabled={saving}
                  onClick={() => setEditorOpen(false)}
                >
                  取消
                </button>
                <button
                  className="primary-button"
                  disabled={saving || !draft.name.trim() || !draft.username.trim()}
                >
                  {saving ? '保存中…' : draft.id ? '保存修改' : '创建客服'}
                </button>
              </footer>
            </form>
          </section>
        </div>
      )}
    </div>
  );
}
'''
          s = s[:start] + replacement + s[end:]
          app.write_text(s)

          css = Path('src/dashboard/styles.css')
          s = css.read_text()
          s += r'''

/* Admin console */
.admin-console {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 228px minmax(0, 1fr);
  background: #f6f7f9;
}

.admin-sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 14px 16px;
  border-right: 1px solid #e5e7eb;
  background: #fff;
  display: flex;
  flex-direction: column;
}

.admin-brand {
  min-height: 58px;
  padding: 8px 10px 18px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid #eef0f2;
}

.admin-brand > span {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: #17191e;
  color: #fff;
  font-size: 12px;
  font-weight: 900;
}

.admin-brand > div {
  display: grid;
  gap: 2px;
}

.admin-brand strong {
  font-size: 15px;
}

.admin-brand small {
  color: #8a8f99;
  font-size: 11px;
}

.admin-nav {
  padding: 16px 0;
  display: grid;
  gap: 5px;
}

.admin-nav button {
  width: 100%;
  min-height: 43px;
  padding: 0 11px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: #555b66;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 650;
  text-align: left;
}

.admin-nav button:hover {
  background: #f5f6f8;
}

.admin-nav button.active {
  background: #17191e;
  color: #fff;
}

.admin-nav button small {
  color: inherit;
  opacity: 0.65;
  font-size: 11px;
  font-weight: 600;
}

.admin-sidebar-foot {
  margin-top: auto;
  display: grid;
  gap: 7px;
}

.admin-sidebar-foot a,
.admin-sidebar-foot button {
  min-height: 40px;
  padding: 0 10px;
  border: 1px solid #e4e6ea;
  border-radius: 9px;
  background: #fff;
  color: #5f6570;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 650;
}

.admin-content {
  width: 100%;
  max-width: 1500px;
  padding: 30px 34px 50px;
  overflow: hidden;
}

.admin-content-head {
  min-height: 64px;
  margin-bottom: 22px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}

.admin-content-head h1 {
  font-size: 27px;
  letter-spacing: -0.035em;
}

.admin-content-head p {
  max-width: 760px;
  margin-top: 6px;
  color: #7c828c;
  font-size: 13px;
  line-height: 1.6;
}

.admin-content > .notice {
  max-width: none;
  margin: 0 0 18px;
}

.admin-stats {
  margin-bottom: 16px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.admin-stats > div {
  min-height: 90px;
  padding: 17px 18px;
  border: 1px solid #e3e5e9;
  border-radius: 13px;
  background: #fff;
  display: grid;
  align-content: space-between;
  box-shadow: 0 3px 12px rgba(22, 25, 31, 0.025);
}

.admin-stats span {
  color: #838892;
  font-size: 12px;
  font-weight: 650;
}

.admin-stats strong {
  font-size: 26px;
  letter-spacing: -0.04em;
}

.admin-table-card {
  border: 1px solid #e1e3e7;
  border-radius: 14px;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 5px 18px rgba(22, 25, 31, 0.025);
}

.admin-table-title {
  min-height: 68px;
  padding: 15px 18px;
  border-bottom: 1px solid #eceef1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.admin-table-title > div {
  display: grid;
  gap: 4px;
}

.admin-table-title strong {
  font-size: 15px;
}

.admin-table-title span {
  color: #858a94;
  font-size: 12px;
}

.admin-table-wrap {
  overflow-x: auto;
}

.admin-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.admin-table th {
  height: 43px;
  padding: 0 15px;
  border-bottom: 1px solid #eceef1;
  background: #fafbfc;
  color: #7b818b;
  font-size: 11px;
  font-weight: 700;
  text-align: left;
  white-space: nowrap;
}

.admin-table td {
  min-height: 58px;
  padding: 14px 15px;
  border-bottom: 1px solid #f0f1f3;
  color: #555b65;
  vertical-align: middle;
}

.admin-table tbody tr:last-child td {
  border-bottom: 0;
}

.admin-table tbody tr:hover {
  background: #fbfbfc;
}

.admin-agent-cell {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #202329;
}

.group-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.group-tags span {
  padding: 4px 7px;
  border-radius: 6px;
  background: #f1f3f5;
  color: #5e646e;
  font-size: 11px;
  white-space: nowrap;
}

.group-tags em {
  color: #9a9ea6;
  font-style: normal;
  font-size: 12px;
}

.account-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #737984;
  font-size: 12px;
  font-weight: 650;
  white-space: nowrap;
}

.account-status::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #b8bcc4;
}

.account-status.online::before {
  background: #2da66d;
}

.account-status.busy::before {
  background: #cf9135;
}

.table-action {
  min-height: 30px;
  padding: 0 9px;
  border: 1px solid #e0e2e6;
  border-radius: 7px;
  background: #fff;
  color: #555b65;
  font-size: 12px;
  font-weight: 650;
}

.admin-empty {
  min-height: 270px;
}

.admin-empty .primary-button {
  width: max-content;
  margin: 8px auto 0;
}

.groups-title {
  align-items: center;
}

.group-create {
  display: flex;
  gap: 8px;
}

.group-create input {
  width: 220px;
  min-height: 40px;
  padding: 0 11px;
  border: 1px solid #dfe2e6;
  border-radius: 9px;
  outline: none;
}

.group-create input:focus {
  border-color: #979ca5;
  box-shadow: 0 0 0 3px rgba(30, 33, 39, 0.04);
}

.workspace-access-card {
  min-height: 260px;
  padding: 30px;
  border: 1px solid #e1e3e7;
  border-radius: 16px;
  background: #fff;
  display: flex;
  align-items: flex-start;
  gap: 22px;
  box-shadow: 0 5px 18px rgba(22, 25, 31, 0.025);
}

.workspace-access-icon {
  width: 52px;
  height: 52px;
  flex: 0 0 auto;
  border-radius: 13px;
  display: grid;
  place-items: center;
  background: #17191e;
  color: #fff;
  font-size: 14px;
  font-weight: 900;
}

.workspace-access-copy {
  max-width: 900px;
}

.workspace-access-copy > span {
  color: #8a8f98;
  font-size: 12px;
  font-weight: 700;
}

.workspace-access-copy h2 {
  margin-top: 5px;
  font-size: 23px;
}

.workspace-access-copy p {
  margin-top: 8px;
  color: #747a84;
  line-height: 1.65;
}

.workspace-url-row {
  margin-top: 24px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.workspace-url-row code {
  min-height: 42px;
  padding: 0 13px;
  border: 1px solid #e0e2e6;
  border-radius: 9px;
  background: #f7f8fa;
  display: flex;
  align-items: center;
  color: #30343b;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 50;
  padding: 24px;
  background: rgba(22, 25, 31, 0.38);
  display: grid;
  place-items: center;
  backdrop-filter: blur(2px);
}

.agent-modal {
  width: min(620px, 100%);
  max-height: calc(100vh - 48px);
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 24px 80px rgba(20, 23, 29, 0.18);
  overflow: auto;
}

.agent-modal > header {
  min-height: 78px;
  padding: 19px 22px;
  border-bottom: 1px solid #eceef1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.agent-modal > header h2 {
  font-size: 20px;
}

.agent-modal > header p {
  margin-top: 4px;
  color: #898e97;
  font-size: 12px;
}

.modal-close {
  width: 34px;
  height: 34px;
  border: 1px solid #e2e4e8;
  border-radius: 9px;
  background: #fff;
  color: #777d87;
  font-size: 20px;
  line-height: 1;
}

.agent-editor-form {
  padding: 22px;
  display: grid;
  gap: 17px;
}

.agent-editor-form > label,
.form-two-columns label {
  display: grid;
  gap: 7px;
  color: #50555e;
  font-size: 13px;
  font-weight: 700;
}

.agent-editor-form input:not([type='checkbox']) {
  width: 100%;
  min-height: 43px;
  padding: 0 12px;
  border: 1px solid #dfe2e6;
  border-radius: 9px;
  outline: none;
}

.agent-editor-form input:not([type='checkbox']):focus {
  border-color: #959ba5;
  box-shadow: 0 0 0 3px rgba(30, 33, 39, 0.04);
}

.agent-editor-form label small {
  color: #969ba4;
  font-size: 11px;
  font-weight: 500;
}

.form-two-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.agent-editor-form fieldset {
  margin: 0;
  padding: 0;
  border: 0;
}

.agent-editor-form legend {
  margin-bottom: 9px;
  color: #50555e;
  font-size: 13px;
  font-weight: 700;
}

.modal-group-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.modal-group-option {
  min-height: 40px;
  padding: 8px 10px;
  border: 1px solid #e3e5e9;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
}

.modal-group-option input,
.account-enable-line > input {
  width: 15px;
  height: 15px;
  margin: 0;
}

.account-enable-line {
  min-height: 62px;
  padding: 11px 12px;
  border: 1px solid #e3e5e9;
  border-radius: 9px;
  display: flex !important;
  align-items: flex-start;
  gap: 10px !important;
}

.account-enable-line > input {
  margin-top: 2px;
}

.account-enable-line > span {
  display: grid;
  gap: 3px;
}

.account-enable-line strong {
  color: #34383f;
  font-size: 12px;
}

.account-enable-line small {
  color: #8d929b;
  font-size: 11px;
  font-weight: 500;
}

.agent-editor-form footer {
  padding-top: 4px;
  display: flex;
  justify-content: flex-end;
  gap: 9px;
}

@media (max-width: 900px) {
  .admin-console {
    grid-template-columns: 1fr;
  }

  .admin-sidebar {
    position: static;
    height: auto;
    padding: 12px;
  }

  .admin-nav {
    grid-template-columns: repeat(3, 1fr);
  }

  .admin-sidebar-foot {
    display: none;
  }

  .admin-content {
    padding: 22px 16px 36px;
  }

  .admin-stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .workspace-url-row,
  .groups-title {
    align-items: stretch;
    flex-direction: column;
  }

  .group-create {
    width: 100%;
  }

  .group-create input {
    width: 100%;
  }
}

@media (max-width: 620px) {
  .admin-content-head {
    align-items: stretch;
    flex-direction: column;
  }

  .admin-nav button {
    min-width: 0;
    padding: 0 8px;
    justify-content: center;
  }

  .admin-nav button small {
    display: none;
  }

  .form-two-columns,
  .modal-group-grid {
    grid-template-columns: 1fr;
  }

  .workspace-access-card {
    padding: 22px;
    flex-direction: column;
  }
}
