name: Temporary normalize PR formatting

on:
  push:
    branches:
      - reliability/quota-ledger-reconciliation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format repository
        run: pnpm format:write
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/temporary-format-all.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize quota ledger formatting"
          git push origin HEAD:reliability/quota-ledger-reconciliation
