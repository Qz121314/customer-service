name: Media hot-path one-time validation

on:
  push:
    branches:
      - agent/media-hot-path-d1

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/media-hot-path-d1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply targeted changes
        run: |
          node scripts/optimize-media-hot-path.mjs
          sed -i "3i import { URL } from 'node:url';" test/media-hot-path-cost.test.mjs
          python - <<'PY'
          from pathlib import Path

          cost_path = Path('test/media-hot-path-cost.test.mjs')
          cost_source = cost_path.read_text()
          old = r"media\.sender_type === 'agent' && context\.conversationStatus === 'open'"
          new = r"media\.sender_type === 'agent' &&\s*context\.conversationStatus === 'open'"
          assert old in cost_source
          cost_path.write_text(cost_source.replace(old, new))

          message_path = Path('test/message-send-d1-cost.test.mjs')
          message_source = message_path.read_text()
          old_assertion = "  assert.match(mediaSource, /\\{ includeOverview: true \\}/u);"
          new_assertion = """  assert.doesNotMatch(mediaSource, /\\{ includeOverview: true \\}/u);\n  assert.match(\n    mediaSource,\n    /media\\.sender_type === 'agent' &&\\s*context\\.conversationStatus === 'open'/u,\n  );"""
          assert old_assertion in message_source
          message_path.write_text(message_source.replace(old_assertion, new_assertion))
          PY

      - name: Format targeted files
        run: pnpm exec prettier --write src/worker/media-store.ts src/worker/media-api.ts test/media-hot-path-cost.test.mjs test/message-send-d1-cost.test.mjs

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test media reservation cost
        run: node --experimental-strip-types --test --test-name-pattern="new media reservations" test/media-hot-path-cost.test.mjs

      - name: Test visitor media ownership cost
        run: node --experimental-strip-types --test --test-name-pattern="visitor media ownership" test/media-hot-path-cost.test.mjs

      - name: Test media completion cost
        run: node --experimental-strip-types --test --test-name-pattern="media completion" test/media-hot-path-cost.test.mjs

      - name: Test existing media and realtime contracts
        run: node --experimental-strip-types --test test/customer-service-full-flow.test.mjs test/realtime-contract.test.mjs test/agent-conversation-detail-cost.test.mjs test/message-send-d1-cost.test.mjs

      - name: Test full suite
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Commit validated implementation and remove temporary tooling
        run: |
          set -euo pipefail
          rm scripts/optimize-media-hot-path.mjs .github/workflows/media-hot-path-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bound media hot-path D1 work"
          git push origin HEAD:agent/media-hot-path-d1
