name: Temporary Prettier Probe

on:
  push:
    branches:
      - main

jobs:
  print-formatted-test:
    if: "github.event.head_commit.message == 'chore: run prettier probe'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        shell: bash
        run: |
          pnpm exec prettier test/agent-statistics-retention.test.mjs --write
          echo '---FORMATTED_FILE_BEGIN---'
          cat test/agent-statistics-retention.test.mjs
          echo '---FORMATTED_FILE_END---'
# temporary formatting probe
