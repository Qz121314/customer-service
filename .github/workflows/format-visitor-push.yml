name: Format visitor push

on:
  push:
    branches: [feat/visitor-web-push]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visitor-web-push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:write
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/entry.ts src/worker/push-api.ts src/worker/visitor-push.ts test/visitor-web-push.test.mjs
          git commit -m "格式化访客 Push 代码"
          git push origin HEAD:feat/visitor-web-push
