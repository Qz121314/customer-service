name: Codex restore dashboard app

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codex-restore-dashboard-app
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore complete App and keep quota opt-in
        shell: bash
        run: |
          set -euo pipefail
          git checkout dde76d96b52f47ccc196fef515d0d44140b0ecd4 -- src/dashboard/App.tsx
          python - <<'PY'
          from pathlib import Path
          path = Path('src/dashboard/App.tsx')
          text = path.read_text(encoding='utf-8')
          old = '  dailyConversationLimit: 40,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one default daily quota, found {text.count(old)}')
          path.write_text(text.replace(old, '  dailyConversationLimit: 0,\n', 1), encoding='utf-8')
          PY
      - name: Commit restored dashboard
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-restore-app.yml
          git add src/dashboard/App.tsx
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'fix: restore complete dashboard after quota refinement'
          git push origin HEAD:main
