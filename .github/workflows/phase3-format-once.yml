name: Phase 3 Format Once

on:
  push:
    branches:
      - perf/phase-3-agent-message-hot-path

permissions:
  contents: write

jobs:
  format-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/phase-3-agent-message-hot-path
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/worker/agent-api.ts test/message-send-d1-cost.test.mjs
      - name: Commit formatted files and remove one-shot workflow
        run: |
          git rm .github/workflows/phase3-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/agent-api.ts test/message-send-d1-cost.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format phase3 hot path"
          git push origin HEAD:perf/phase-3-agent-message-hot-path
