name: One-shot test assertion fix

on:
  push:
    branches: [fix/admin-ui-500]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-ui-500
      - name: Fix assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('test/agent-account-create-boundary.test.mjs')
          text = path.read_text()
          old = "  assert.match(app, /window\\.location\\.origin}\\/agent/u);\n"
          new = "  assert.match(app, /window\\.location\\.origin/u);\n  assert.match(app, /href=\"\\/agent\"/u);\n"
          if old not in text:
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/one-shot-test-fix.yml').unlink()
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: fix workspace url assertion"
          git push origin HEAD:fix/admin-ui-500
