name: Diagnose PR86 tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-tests:
    if: github.head_ref == 'fix/conversation-lifecycle-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and print concise failures
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/test.log 2>&1
          status=$?
          echo "TEST_EXIT=$status"
          echo "--- failures ---"
          grep -nE 'not ok|AssertionError|ERR_[A-Z_]+|error:|expected:|actual:|failureType|testCodeFailure' /tmp/test.log | tail -n 220 || true
          echo "--- tail ---"
          tail -n 220 /tmp/test.log
          exit "$status"
