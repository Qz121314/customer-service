name: Avatar Refactor

on:
  push:
    branches:
      - feature/agent-avatar-profile

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-avatar-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-agent-avatar-refactor.mjs
      - run: npx prettier --write src/dashboard/AgentWorkspacePanels.tsx src/worker/client-api.ts
      - name: Commit generated refactor
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/AgentWorkspacePanels.tsx src/worker/client-api.ts
          git commit -m "Wire agent avatar through dashboard and client payloads"
          git push origin HEAD:feature/agent-avatar-profile
