name: Optimize agent active load once

on:
  push:
    branches:
      - agent/bound-agent-active-load
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bound-agent-active-load
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply focused optimization
        run: node scripts/optimize-agent-active-load-once.mjs
      - name: Remove one-time tooling
        run: rm scripts/optimize-agent-active-load-once.mjs .github/workflows/optimize-agent-active-load-once.yml
      - name: Format changed files
        run: pnpm exec prettier --write src/worker/agent-api.ts migrations/0028_conversation_agent_status_index.sql test/agent-active-load-cost.test.mjs
      - name: Validate local D1 migrations
        run: pnpm db:migrate:local
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm cf:check
      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bound agent active load reads"
          git push origin HEAD:agent/bound-agent-active-load
