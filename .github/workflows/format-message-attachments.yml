name: Format message attachments

on:
  push:
    branches:
      - feat/message-attachments

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/message-attachments
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/dashboard/agent-attachments-client.ts
          src/dashboard/AgentAttachmentTools.tsx
          src/dashboard/AgentAutoReplySettings.tsx
          src/dashboard/AgentPortal.tsx
          src/dashboard/dashboard-ui.tsx
          src/worker/agent-attachment-api.ts
          src/worker/assignment-broadcast.ts
          src/worker/message-attachments.ts
          test/agent-auto-greeting.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/dashboard/agent-attachments-client.ts \
            src/dashboard/AgentAttachmentTools.tsx \
            src/dashboard/AgentAutoReplySettings.tsx \
            src/dashboard/AgentPortal.tsx \
            src/dashboard/dashboard-ui.tsx \
            src/worker/agent-attachment-api.ts \
            src/worker/assignment-broadcast.ts \
            src/worker/message-attachments.ts \
            test/agent-auto-greeting.test.mjs
          git commit -m "chore: format message attachment changes"
          git push origin HEAD:feat/message-attachments
