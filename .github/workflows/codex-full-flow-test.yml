name: Codex full-flow test

on:
  push:
    branches: [codex/full-flow-e2e-20260814]

permissions:
  contents: write

concurrency:
  group: codex-customer-service-full-flow-test
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/full-flow-e2e-20260814
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Normalize Node integration-test imports
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'test/customer-service-full-flow.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(
            "import { readdirSync, readFileSync } from 'node:fs';",
            "import { existsSync, readdirSync, readFileSync, symlinkSync, unlinkSync } from 'node:fs';",
          );
          source = source.replace(
            "import { DatabaseSync } from 'node:sqlite';",
            "import { join } from 'node:path';\nimport { DatabaseSync } from 'node:sqlite';",
          );
          source = source.replace(
            "import { fileURLToPath } from 'node:url';",
            "import { fileURLToPath, URL } from 'node:url';",
          );
          source = source.replace(
            "import { agentApi } from '../src/worker/agent-api.ts';\nimport { clientApi } from '../src/worker/client-api.ts';",
            `const workerDirectory = fileURLToPath(new URL('../src/worker/', import.meta.url));
const moduleShims = [];
for (const name of readdirSync(workerDirectory)) {
  if (!name.endsWith('.ts') || name.endsWith('.d.ts')) continue;
  const shimPath = join(workerDirectory, name.slice(0, -3));
  if (existsSync(shimPath)) continue;
  symlinkSync(name, shimPath);
  moduleShims.push(shimPath);
}

let agentApi;
let clientApi;
try {
  [{ agentApi }, { clientApi }] = await Promise.all([
    import('../src/worker/agent-api.ts'),
    import('../src/worker/client-api.ts'),
  ]);
} finally {
  for (const shimPath of moduleShims) unlinkSync(shimPath);
}`,
          );
          fs.writeFileSync(path, source);
          NODE
      - name: Format test
        run: pnpm exec prettier --write test/customer-service-full-flow.test.mjs
      - name: Verify project
        run: pnpm verify
      - name: Commit verified test
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-full-flow-test.yml
          git add test/customer-service-full-flow.test.mjs
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'test: cover isolated client-agent full flow'
          git push origin HEAD:codex/full-flow-e2e-20260814
