name: Codex full-flow test

on:
  push:
    branches: [codex/full-flow-e2e-20260814]

permissions:
  contents: write

concurrency:
  group: codex-customer-service-full-flow-test
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/full-flow-e2e-20260814
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format test
        run: pnpm exec prettier --write test/customer-service-full-flow.test.mjs
      - name: Verify project
        run: pnpm verify
      - name: Commit verified test
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-full-flow-test.yml
          git add test/customer-service-full-flow.test.mjs
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'test: cover isolated client-agent full flow'
          git push origin HEAD:codex/full-flow-e2e-20260814
