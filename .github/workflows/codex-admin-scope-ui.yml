name: Codex admin scope UI

on:
  push:
    branches: [codex/admin-scope-ui-20260815]

permissions:
  contents: write

concurrency:
  group: codex-customer-service-admin-scope-ui
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: codex/admin-scope-ui-20260815
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply UI refinement
        run: python .github/scripts/apply_admin_scope_ui.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: pnpm format:write

      - name: Verify project
        run: pnpm verify

      - name: Commit verified UI refinement
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-admin-scope-ui.yml .github/scripts/apply_admin_scope_ui.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'ui: make agent routing scope-first and refine workspace layout'
          git push origin HEAD:codex/admin-scope-ui-20260815
