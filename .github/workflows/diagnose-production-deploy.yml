name: Diagnose production deploy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-production-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Inspect remote D1 migrations
        run: pnpm exec wrangler d1 migrations list customer-service-db --remote

      - name: Deploy current main-equivalent build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy:cloudflare 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1)"
          if [ -z "$url" ]; then
            echo 'Wrangler completed without a workers.dev URL in its output.' >&2
            cat /tmp/deploy.log >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production protocols
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke:production
