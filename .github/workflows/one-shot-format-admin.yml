name: One-shot format admin
on:
  push:
    branches: [ui-admin-repair]
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/worker/admin-config-api.ts
      - run: rm .github/workflows/one-shot-format-admin.yml
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format admin worker"
          git push
