name: Temporary format push quota hardening

on:
  push:
    branches:
      - reliability/push-quota-hardening

permissions:
  contents: write

jobs:
  format-push-quota:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/worker/agent-push-api.ts
          src/worker/push-api.ts
          test/push-subscription-reliability.test.mjs
          test/waiting-paid-traffic-recovery.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- \
            src/worker/agent-push-api.ts \
            src/worker/push-api.ts \
            test/push-subscription-reliability.test.mjs \
            test/waiting-paid-traffic-recovery.test.mjs; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/worker/agent-push-api.ts \
            src/worker/push-api.ts \
            test/push-subscription-reliability.test.mjs \
            test/waiting-paid-traffic-recovery.test.mjs
          git commit -m "Format push quota hardening"
          git push origin HEAD:reliability/push-quota-hardening
