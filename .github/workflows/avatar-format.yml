name: Avatar Format

on:
  push:
    branches:
      - feature/agent-avatar-profile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-avatar-profile
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/dashboard/agent-avatar-image.ts src/dashboard/agent-avatar.css src/dashboard/AgentAvatarControl.tsx src/worker/agent-avatar-api.ts test/agent-avatar-contract.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/agent-avatar-image.ts src/dashboard/agent-avatar.css src/dashboard/AgentAvatarControl.tsx src/worker/agent-avatar-api.ts test/agent-avatar-contract.test.mjs
          git commit -m "Format agent avatar implementation"
          git push origin HEAD:feature/agent-avatar-profile
