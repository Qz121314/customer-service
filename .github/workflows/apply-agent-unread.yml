name: Apply agent unread state

on:
  push:
    branches:
      - feat/agent-unread-state

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent-unread-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/patch-agent-unread.py
      - run: pnpm exec prettier --write src/worker/client-api.ts src/worker/media-store.ts src/worker/agent-api.ts src/dashboard/api.ts src/dashboard/App.tsx src/dashboard/styles.css test/agent-unread.test.mjs migrations/0009_agent_unread.sql
      - run: pnpm db:migrate:local
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm cf:check
      - name: Commit changes
        run: |
          rm scripts/patch-agent-unread.py
          rm .github/workflows/apply-agent-unread.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "增加坐席未读和新会话提醒 [agent-unread-applied]"
          git push origin HEAD:feat/agent-unread-state
