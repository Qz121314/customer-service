name: Apply agent realtime hardening

on:
  push:
    branches:
      - feat/agent-realtime-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/patch-agent-realtime.py
      - run: pnpm exec prettier --write src/dashboard/App.tsx test/agent-realtime-hardening.test.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm cf:check
      - name: Commit changes
        run: |
          rm scripts/patch-agent-realtime.py
          rm .github/workflows/apply-agent-realtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "优化坐席实时连接和请求策略"
          git push origin HEAD:feat/agent-realtime-hardening
