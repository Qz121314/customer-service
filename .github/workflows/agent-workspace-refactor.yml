name: Agent Workspace Refactor

on:
  push:
    branches: [ui/agent-workspace-local]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-workspace-refactor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/agent-workspace-local
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply workspace refactor
        run: node scripts/refactor-agent-workspace.mjs

      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          README.md
          src/dashboard/main.tsx
          src/dashboard/dashboard-runtime.ts
          src/dashboard/AgentPortal.tsx
          src/dashboard/api.ts
          src/worker/agent-api.ts
          src/dashboard/agent-workspace.css
          test/agent-transfer-quick-replies.test.mjs
          test/agent-mobile-layout-contract.test.mjs
          test/agent-workspace-ui-contract.test.mjs

      - name: Validate formatting
        run: pnpm format

      - name: Remove temporary refactor files
        run: |
          rm -f scripts/refactor-agent-workspace.mjs
          rm -f .github/workflows/agent-workspace-refactor.yml

      - name: Commit generated refactor
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refactor agent workspace and localize quick replies"
          git push origin HEAD:ui/agent-workspace-local
