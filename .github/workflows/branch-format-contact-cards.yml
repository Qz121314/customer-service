name: Branch Format Contact Cards

on:
  push:
    branches:
      - fix/sms-contact-card-icons

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply contact card prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format contact card changes
        run: >-
          pnpm exec prettier --write
          src/dashboard/agent-attachments-client.ts
          src/dashboard/AgentAttachmentTools.tsx
          src/dashboard/AgentPortal.tsx
          src/dashboard/dashboard-ui.tsx
          src/worker/agent-attachment-api.ts
          test/agent-card-contract.test.mjs
          test/agent-card-icon-browser-smoke.spec.mjs
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/dashboard/agent-attachments-client.ts \
            src/dashboard/AgentAttachmentTools.tsx \
            src/dashboard/AgentPortal.tsx \
            src/dashboard/dashboard-ui.tsx \
            src/worker/agent-attachment-api.ts \
            test/agent-card-contract.test.mjs \
            test/agent-card-icon-browser-smoke.spec.mjs
          git commit -m "chore: apply contact card prettier"
          git push origin HEAD:fix/sms-contact-card-icons
