name: One-time routing scope D1 optimization

on:
  push:
    branches:
      - agent/bound-routing-scope-d1

permissions:
  contents: write

jobs:
  optimize-routing-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/bound-routing-scope-d1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply deterministic optimization
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/optimize-routing-scope-d1.mjs';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('const replacement = String.raw`', 'const replacement = `');
          fs.writeFileSync(path, source);
          NODE
          node scripts/optimize-routing-scope-d1.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'test/routing-scope-d1-cost.test.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const start = source.indexOf('  assert.doesNotMatch(admin, /SELECT DISTINCT section_id');
          const end = source.indexOf('  assert.match(migration', start);
          if (start < 0 || end < 0 || end <= start) {
            throw new Error('Could not locate routing scope validation contract block.');
          }
          const replacement = `  const validationStart = admin.indexOf('async function allEnabledSectionsExist');\n  const validationEnd = admin.indexOf('function normalizedIdentifiers', validationStart);\n  assert.ok(validationStart >= 0 && validationEnd > validationStart);\n  const validation = admin.slice(validationStart, validationEnd);\n  assert.doesNotMatch(validation, /SELECT DISTINCT section_id/u);\n  assert.doesNotMatch(validation, /\\.all</u);\n`;
          source = `${source.slice(0, start)}${replacement}${source.slice(end)}`;
          fs.writeFileSync(path, source);
          NODE

      - name: Remove one-time tooling
        run: |
          rm scripts/optimize-routing-scope-d1.mjs
          rm .github/workflows/optimize-routing-scope-d1-once.yml

      - name: Format changed source
        run: pnpm exec prettier --write src/worker/admin-config-api.ts test/routing-scope-d1-cost.test.mjs

      - name: Validate source
        run: |
          pnpm db:migrate:local
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm cf:check

      - name: Commit validated optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Bound routing scope D1 work"
          git push origin HEAD:agent/bound-routing-scope-d1
