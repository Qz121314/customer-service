name: Temporary diagnose push quota tests

on:
  push:
    branches:
      - reliability/push-quota-hardening
    paths-ignore:
      - diagnostic-push-quota.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused tests
        shell: bash
        run: |
          set +e
          node --test \
            test/agent-traffic-quota.test.mjs \
            test/waiting-paid-traffic-recovery.test.mjs \
            test/waiting-assignment-batch.test.mjs \
            test/agent-daily-quota.test.mjs \
            test/product-agent-routing.test.mjs \
            test/push-subscription-reliability.test.mjs \
            > /tmp/test.log 2>&1
          status=$?
          {
            echo "exit=$status"
            grep -E -A14 -B6 'not ok|AssertionError|ERR_|error:|failureType|actual:|expected:' /tmp/test.log | tail -n 260
          } > diagnostic-push-quota.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic-push-quota.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Capture push quota test failure"
          git push origin HEAD:reliability/push-quota-hardening
