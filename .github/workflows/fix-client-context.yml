name: Fix client context type

on:
  push:
    branches: [feat/site-realtime-bridge]
    paths:
      - .github/workflows/fix-client-context.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/site-realtime-bridge

      - name: Patch context helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worker/client-api.ts')
          text = path.read_text()
          text = text.replace("import { Hono } from 'hono';", "import { Hono, type Context } from 'hono';")
          old = """function error(\n  c: Parameters<typeof clientApi.get>[1] extends (context: infer C) => unknown\n    ? C\n    : never,\n  status: 400 | 401 | 404 | 409 | 426,\n  code: string,\n  message: string,\n) {"""
          new = """function error(\n  c: Context<ClientEnv>,\n  status: 400 | 401 | 404 | 409 | 426,\n  code: string,\n  message: string,\n) {"""
          if old not in text:
              raise SystemExit('Expected error helper was not found')
          path.write_text(text.replace(old, new))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec prettier --write src/worker/client-api.ts

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker/client-api.ts
          git commit -m 'fix: type client API context'
          git push origin HEAD:feat/site-realtime-bridge
