name: Remove transfer test residue

on:
  push:
    branches:
      - chore/final-remove-manual-transfer

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove transfer-only full-flow blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('test/customer-service-full-flow.test.mjs')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r"\n  const standbyToken = 'agent-session-standby';.*?(?=\n  database\.close\(\);\n\}\);)",
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one transfer tail in primary full-flow test, found {count}')

          text, count = re.subn(
              r"\n  const cookieA = `cs_agent_session=\$\{tokenA\}`;.*?(?=\n  const beforeTransferB = database)",
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one transfer-target inbox block, found {count}')

          text, count = re.subn(
              r"\n  const transferResponse = await agentApi\.fetch\(.*?(?=\n  const topUpResponse = await adminConfigApi\.request)",
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one commercial transfer/requeue block, found {count}')

          text = text.replace('beforeTransferB', 'beforeReassignmentB')
          text = text.replace(
              'immutable first-reception receipts must remain the billing source of truth after transfers',
              'immutable first-reception receipts must remain the billing source of truth after reassignment',
          )

          forbidden = [
              '/transfer',
              'transferTargets',
              'transferResponse',
              'requeueResponse',
              'Agent Transfer',
              'agent-transfer',
          ]
          leftovers = [token for token in forbidden if token in text]
          if leftovers:
              raise SystemExit('Transfer-only full-flow residue remains: ' + ', '.join(leftovers))

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/remove-transfer-test-residue.yml').unlink()
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: remove manual transfer flow coverage'
          git push origin HEAD:chore/final-remove-manual-transfer
