name: Temporary format agent push

on:
  push:
    branches:
      - agent/push-open-latest-unread

permissions:
  contents: write

jobs:
  format-agent-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format agent push helper
        run: pnpm exec prettier --write src/dashboard/agent-push.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- src/dashboard/agent-push.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dashboard/agent-push.ts
          git commit -m "Format agent push helper"
          git push origin HEAD:agent/push-open-latest-unread
