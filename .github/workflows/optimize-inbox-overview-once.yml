name: Optimize inbox overview once

on:
  push:
    branches:
      - agent/fold-inbox-overview-counts

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fold overview counts into inbox scan
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/worker/agent-api.ts')
          source = path.read_text()

          overview_pattern = re.compile(
              r"async function loadAgentOverview\(db: D1Database, agentId: string\) \{.*?\n\}\n\nasync function loadTransferTargets",
              re.S,
          )
          overview_replacement = r'''async function loadAgentQuotaOverview(db: D1Database, agentId: string) {
            const businessDate = routingBusinessDate();
            const quotaRow = await db
              .prepare(
                `SELECT a.daily_conversation_limit, a.traffic_quota_enabled,
                 a.traffic_quota_total, a.traffic_quota_used,
                 COALESCE(s.conversation_count, 0) AS today_count
               FROM agents a
               LEFT JOIN agent_daily_stats s
                 ON s.site_id = a.site_id
                AND s.agent_id = a.id
                AND s.business_date = ?2
               WHERE a.id = ?1
               LIMIT 1`,
              )
              .bind(agentId, businessDate)
              .first<{
                daily_conversation_limit: number;
                today_count: number;
                traffic_quota_enabled: number;
                traffic_quota_total: number;
                traffic_quota_used: number;
              }>();
            return {
              todayAccepted: Number(quotaRow?.today_count ?? 0),
              dailyLimit: Number(quotaRow?.daily_conversation_limit ?? 0),
              trafficQuotaEnabled: quotaRow?.traffic_quota_enabled === 1,
              trafficQuotaTotal: Number(quotaRow?.traffic_quota_total ?? 0),
              trafficQuotaUsed: Number(quotaRow?.traffic_quota_used ?? 0),
              trafficQuotaRemaining: Math.max(
                0,
                Number(quotaRow?.traffic_quota_total ?? 0) -
                  Number(quotaRow?.traffic_quota_used ?? 0),
              ),
            };
          }

          async function loadAgentOverview(db: D1Database, agentId: string) {
            const [statusResult, quotaOverview] = await Promise.all([
              db
                .prepare(
                  `SELECT status, COUNT(*) AS count
                 FROM conversations
                 WHERE assigned_agent = ?1
                   AND COALESCE(expires_at, datetime(created_at, '+1 day')) > CURRENT_TIMESTAMP
                 GROUP BY status`,
                )
                .bind(agentId)
                .all<{ status: ConversationStatus; count: number }>(),
              loadAgentQuotaOverview(db, agentId),
            ]);
            const counts = { open: 0, pending: 0, closed: 0 };
            for (const row of statusResult.results ?? [])
              counts[row.status] = Number(row.count ?? 0);
            return {
              ...counts,
              total: counts.open + counts.pending + counts.closed,
              ...quotaOverview,
            };
          }

          async function loadTransferTargets'''
          source, count = overview_pattern.subn(overview_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'overview replacement count={count}')

          inbox_pattern = re.compile(
              r"async function loadAgentInbox\(.*?\n\}\n\nagentApi\.get\('/api/agent/stats'",
              re.S,
          )
          inbox_replacement = r'''async function loadAgentInbox(
            db: D1Database,
            agent: AgentSession,
            requestedStatus?: string,
          ) {
            type InboxConversationRow = Record<string, unknown> & {
              __overview_open?: number;
              __overview_pending?: number;
              __overview_closed?: number;
            };

            const filtered =
              requestedStatus === 'open' ||
              requestedStatus === 'pending' ||
              requestedStatus === 'closed';
            const overviewColumns = filtered
              ? ''
              : `       SUM(CASE WHEN c.status = 'open' THEN 1 ELSE 0 END) OVER () AS __overview_open,
               SUM(CASE WHEN c.status = 'pending' THEN 1 ELSE 0 END) OVER () AS __overview_pending,
               SUM(CASE WHEN c.status = 'closed' THEN 1 ELSE 0 END) OVER () AS __overview_closed,
          `;
            let statement = db.prepare(
              `SELECT c.id, c.site_id, c.visitor_id, c.status, c.subject, c.group_id,
                 c.product_id, c.section_id, c.section_name, c.category_id,
                 c.category_name, c.product_title, c.product_cover_url, c.product_href,
                 c.assigned_agent, c.agent_unread_count, c.last_message_at, c.created_at,
                 c.expires_at,
                 v.display_name AS visitor_name,
          ${overviewColumns}       (SELECT body FROM messages m WHERE m.conversation_id = c.id
                  ORDER BY m.created_at DESC, m.id DESC LIMIT 1) AS last_message
               FROM conversations c
               JOIN visitors v ON v.id = c.visitor_id
               WHERE c.assigned_agent = ?1
                 AND COALESCE(c.expires_at, datetime(c.created_at, '+1 day')) > CURRENT_TIMESTAMP
                 ${filtered ? 'AND c.status = ?2' : ''}
               ORDER BY CASE WHEN c.status = 'closed' THEN 1 ELSE 0 END,
                 c.last_message_at DESC, c.id DESC
               LIMIT 100`,
            );
            statement = filtered
              ? statement.bind(agent.id, requestedStatus)
              : statement.bind(agent.id);
            const transferTargetsRequest = loadTransferTargets(db, agent.id);
            const quickRepliesRequest = loadQuickReplies(db, agent.id);

            if (filtered) {
              const [result, overview, transferTargets, quickReplies] = await Promise.all([
                statement.all<InboxConversationRow>(),
                loadAgentOverview(db, agent.id),
                transferTargetsRequest,
                quickRepliesRequest,
              ]);
              return {
                conversations: result.results ?? [],
                overview,
                transferTargets,
                quickReplies,
                availability: agent.status === 'busy' ? 'busy' : 'online',
              };
            }

            const [result, quotaOverview, transferTargets, quickReplies] = await Promise.all([
              statement.all<InboxConversationRow>(),
              loadAgentQuotaOverview(db, agent.id),
              transferTargetsRequest,
              quickRepliesRequest,
            ]);
            const conversations = result.results ?? [];
            const firstConversation = conversations[0];
            const counts = {
              open: Number(firstConversation?.__overview_open ?? 0),
              pending: Number(firstConversation?.__overview_pending ?? 0),
              closed: Number(firstConversation?.__overview_closed ?? 0),
            };
            for (const conversation of conversations) {
              delete conversation.__overview_open;
              delete conversation.__overview_pending;
              delete conversation.__overview_closed;
            }
            return {
              conversations,
              overview: {
                ...counts,
                total: counts.open + counts.pending + counts.closed,
                ...quotaOverview,
              },
              transferTargets,
              quickReplies,
              availability: agent.status === 'busy' ? 'busy' : 'online',
            };
          }

          agentApi.get('/api/agent/stats' '''
          source, count = inbox_pattern.subn(inbox_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'inbox replacement count={count}')

          path.write_text(source)

          test_path = Path('test/agent-inbox-optimization.test.mjs')
          test_source = test_path.read_text()
          marker = "test('agent inbox folds unfiltered overview counts into the conversation scan'"
          if marker not in test_source:
              test_source += r'''

          test('agent inbox folds unfiltered overview counts into the conversation scan', async () => {
            const worker = await read('../src/worker/agent-api.ts');
            const start = worker.indexOf('async function loadAgentInbox');
            const end = worker.indexOf("agentApi.get('/api/agent/stats'", start);
            assert.ok(start >= 0 && end > start);
            const inbox = worker.slice(start, end);

            assert.match(
              inbox,
              /SUM\(CASE WHEN c\.status = 'open' THEN 1 ELSE 0 END\) OVER \(\) AS __overview_open/u,
            );
            assert.match(
              inbox,
              /SUM\(CASE WHEN c\.status = 'pending' THEN 1 ELSE 0 END\) OVER \(\) AS __overview_pending/u,
            );
            assert.match(
              inbox,
              /SUM\(CASE WHEN c\.status = 'closed' THEN 1 ELSE 0 END\) OVER \(\) AS __overview_closed/u,
            );
            assert.match(inbox, /loadAgentQuotaOverview\(db, agent\.id\)/u);
            assert.match(inbox, /if \(filtered\) \{[\s\S]*loadAgentOverview\(db, agent\.id\)/u);
            assert.equal(
              (inbox.match(/loadAgentOverview\(db, agent\.id\)/gu) ?? []).length,
              1,
            );
            assert.match(inbox, /delete conversation\.__overview_open/u);
          });
          '''
          test_path.write_text(test_source)
          PY
      - name: Format touched files
        run: pnpm exec prettier --write src/worker/agent-api.ts test/agent-inbox-optimization.test.mjs
      - name: Validate local D1 migrations
        run: pnpm db:migrate:local
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Validate Worker bundle
        run: pnpm cf:check
      - name: Commit final changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/optimize-inbox-overview-once.yml
          git add src/worker/agent-api.ts test/agent-inbox-optimization.test.mjs
          git commit -m "Fold inbox overview counts into conversation scan"
          git push origin HEAD:agent/fold-inbox-overview-counts
