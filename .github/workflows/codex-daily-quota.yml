name: Codex daily quota patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: codex-customer-service-daily-quota
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Apply daily quota implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_daily_quota.py')
          text = path.read_text(encoding='utf-8')
          old = """    if count != 1:\n        raise RuntimeError(f'{path}: expected one match, found {count}: {old[:120]!r}')\n    write(path, text.replace(old, new, 1))"""
          new = """    if count != 1:\n        allow_first = count == 2 and (\n            (path == 'src/worker/routing.ts' and 'a.max_active_conversations = 0' in old)\n            or (path == 'src/worker/admin-config-api.ts' and 'maxActiveConversations?: number;' in old)\n            or (path == 'src/dashboard/api.ts' and 'maxActiveConversations: number;' in old)\n            or (path == 'src/dashboard/App.tsx' and 'maxActiveConversations: draft.maxActiveConversations' in old)\n        )\n        if allow_first:\n            write(path, text.replace(old, new, 1))\n            return\n        if (\n            count == 0\n            and path == 'test/product-agent-routing.test.mjs'\n            and 'maxActiveConversations = 0' in old\n        ):\n            alternate = \"{ id, status = 'online', lastAssignedAt = null, maxActiveConversations = 0 },\"\n            if alternate in text:\n                write(\n                    path,\n                    text.replace(\n                        alternate,\n                        \"{\\n    id,\\n    status = 'online',\\n    lastAssignedAt = null,\\n    maxActiveConversations = 0,\\n    dailyConversationLimit = 0,\\n  },\",\n                        1,\n                    ),\n                )\n                return\n        raise RuntimeError(f'{path}: expected one match, found {count}: {old[:120]!r}')\n    write(path, text.replace(old, new, 1))"""
          if old not in text:
              raise SystemExit('patch helper signature not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/apply_daily_quota.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format changed sources
        run: pnpm format:write
      - name: Verify project
        run: pnpm verify
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-daily-quota.yml .github/scripts/apply_daily_quota.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'feat: enforce daily agent quotas and add monthly statistics'
          git push origin HEAD:main
