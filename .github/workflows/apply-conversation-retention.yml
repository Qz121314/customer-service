name: Finalize conversation retention invariants

on:
  push:
    branches: [agent/conversation-24h-retention]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/conversation-24h-retention
          fetch-depth: 0

      - name: Enforce exact expiry invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          client = Path('src/worker/client-api.ts')
          source = client.read_text()
          before = """  const conversationId = crypto.randomUUID();\n  const now = new Date().toISOString();\n  const expiresAt = conversationExpiresAt(new Date());\n"""
          after = """  const conversationId = crypto.randomUUID();\n  const now = new Date().toISOString();\n  const expiresAt = conversationExpiresAt(now);\n"""
          if before not in source:
              raise SystemExit('conversation creation expiry anchor missing')
          client.write_text(source.replace(before, after, 1))

          agent = Path('src/worker/agent-api.ts')
          source = agent.read_text()
          before = """    `UPDATE conversations\n     SET status = ?1, updated_at = CURRENT_TIMESTAMP\n     WHERE id = ?2 AND assigned_agent = ?3`,\n"""
          after = """    `UPDATE conversations\n     SET status = ?1, updated_at = CURRENT_TIMESTAMP\n     WHERE id = ?2 AND assigned_agent = ?3\n       AND COALESCE(expires_at, datetime(created_at, '+1 day')) > CURRENT_TIMESTAMP`,\n"""
          if before not in source:
              raise SystemExit('conversation status expiry anchor missing')
          agent.write_text(source.replace(before, after, 1))
          PY

      - name: Set up Node.js and pnpm
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm install --global pnpm@11.19.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format before validation
        run: pnpm format:write

      - name: Verify implementation
        run: pnpm verify

      - name: Commit verified invariants
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/worker/client-api.ts src/worker/agent-api.ts
          git diff --cached --check
          git commit --no-verify -m "收紧会话24小时到期边界"
          git push
