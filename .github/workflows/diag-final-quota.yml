name: Temporary final quota harness fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acceptance/quota-final-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize quota acceptance harness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('test/customer-service-full-flow.test.mjs')
          text = path.read_text()
          text = text.replace('let adminQuotaApi;\n', '', 1)
          text = text.replace('    { adminQuotaApi },\n', '', 1)
          text = text.replace("    import('../src/worker/admin-quota-api.ts'),\n", '', 1)

          start = text.index('  const ledgerA = await json(\n')
          end_marker = '  database.close();\n});'
          end = text.index(end_marker, start)
          ledger = '''  function readQuotaLedger(agentId) {
            const row = database
              .prepare(
                `SELECT
                   agent.traffic_quota_total AS total,
                   agent.traffic_quota_used AS used,
                   agent.traffic_quota_total_baseline + COALESCE((
                     SELECT SUM(adjustment.amount)
                     FROM agent_quota_adjustments adjustment
                     WHERE adjustment.site_id = agent.site_id
                       AND adjustment.agent_id = agent.id
                       AND adjustment.applied_at IS NOT NULL
                   ), 0) AS expectedTotal,
                   agent.traffic_quota_archived_used + COALESCE((
                     SELECT COUNT(*)
                     FROM agent_traffic_receipts receipt
                     WHERE receipt.site_id = agent.site_id
                       AND receipt.agent_id = agent.id
                       AND receipt.quota_consumed = 1
                   ), 0) AS expectedUsed
                 FROM agents agent
                 WHERE agent.site_id = 'default'
                   AND agent.id = ?`,
              )
              .get(agentId);
            return {
              ...row,
              consistent:
                row.total === row.expectedTotal && row.used === row.expectedUsed,
            };
          }

          assert.deepEqual(readQuotaLedger(agentA), {
            total: 3,
            used: 3,
            expectedTotal: 3,
            expectedUsed: 3,
            consistent: true,
          });
          assert.deepEqual(readQuotaLedger(agentB), {
            total: 1,
            used: 1,
            expectedTotal: 1,
            expectedUsed: 1,
            consistent: true,
          });

          '''
          text = text[:start] + ledger + text[end:]

          acceptance_start = text.index(
              "test('consultation quota commercial lifecycle remains consistent end to end'"
          )
          create_seat = text.index('  async function createSeat({', acceptance_start)
          catalog = '''  database.exec(`
            INSERT INTO product_catalog (
              site_id, id, title, section_id, section_name, category_id,
              category_name, is_enabled
            ) VALUES
              ('default', 'quota-product-west', 'Quota West', 'west', 'West',
               'quota-test', 'Quota test', 1),
              ('default', 'quota-product-east', 'Quota East', 'east', 'East',
               'quota-test', 'Quota test', 1);
          `);

          '''
          text = text[:create_seat] + catalog + text[create_seat:]
          text = text.replace(
              '    const visitorId = `quota-final-visitor-${handoffIndex}`;\n',
              '    const visitorId = `QTA00${handoffIndex}`;\n',
              1,
          )
          text = text.replace(
              '          sourceHandoffId: `quota-final-handoff-${handoffIndex}`,\n',
              "          sourceHandoffId: `00000000-0000-4000-8000-${String(handoffIndex).padStart(12, '0')}`,\n",
              1,
          )

          acceptance = text[acceptance_start:]
          for total, used in [(1, 1), (2, 2), (3, 3)]:
              literal = f'{{ total: {total}, used: {used} }}'
              sqlite_expected = (
                  'Object.assign(Object.create(null), '
                  + literal
                  + ')'
              )
              if literal not in acceptance:
                  raise SystemExit(f'quota expected row missing: {total}/{used}')
              acceptance = acceptance.replace(literal, sqlite_expected, 1)
          text = text[:acceptance_start] + acceptance

          if 'adminQuotaApi' in text:
              raise SystemExit('adminQuotaApi reference still present')
          path.write_text(text)
          PY
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format acceptance test
        run: pnpm exec prettier --write test/customer-service-full-flow.test.mjs
      - name: Run full test suite
        run: pnpm test
      - name: Remove temporary files and commit verified acceptance
        shell: bash
        run: |
          rm -f diagnostic-final-quota.txt .quota-harness-trigger
          rm .github/workflows/diag-final-quota.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/customer-service-full-flow.test.mjs diagnostic-final-quota.txt .quota-harness-trigger .github/workflows/diag-final-quota.yml
          git commit -m "Add final quota lifecycle acceptance coverage"
          git push origin HEAD:acceptance/quota-final-e2e
