name: Manual Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-service-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Cloudflare
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy:cloudflare | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          health=""
          for attempt in {1..20}; do
            health="$(curl --fail --silent --show-error "$BASE_URL/api/health" || true)"
            if printf '%s' "$health" | node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(0, "utf8"));
              process.exit(value.ok === true && value.service === "customer-service" ? 0 : 1);
            '; then
              echo "Production health check passed: $BASE_URL"
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed. Last response: $health" >&2
          exit 1
