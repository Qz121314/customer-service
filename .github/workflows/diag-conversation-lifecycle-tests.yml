name: Diagnose conversation lifecycle tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests and print concise failures
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/test.log 2>&1
          status=$?
          echo "TEST_EXIT=$status"
          echo "--- concise failures ---"
          grep -nE 'not ok|AssertionError|ERR_|expected|actual|fail(ed|ure)?' /tmp/test.log | tail -n 140 || true
          echo "--- test log tail ---"
          tail -n 180 /tmp/test.log
          exit "$status"
