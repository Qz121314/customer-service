name: Diagnose conversation lifecycle tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused failing contracts
        shell: bash
        run: |
          set +e
          echo '--- realtime overview test location ---'
          grep -R -nF 'realtime overview scans run only when assignment or status counts can change' test || true
          echo '--- conversation create cost contract ---'
          node --test test/conversation-create-d1-cost.test.mjs
          first=$?
          overview_file=$(grep -R -lF 'realtime overview scans run only when assignment or status counts can change' test | head -n 1)
          second=0
          if [ -n "$overview_file" ]; then
            echo "--- realtime overview contract: $overview_file ---"
            node --test "$overview_file"
            second=$?
          fi
          if [ "$first" -ne 0 ] || [ "$second" -ne 0 ]; then
            exit 1
          fi
