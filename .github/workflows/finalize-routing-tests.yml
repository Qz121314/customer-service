name: Finalize routing test contract

on:
  push:
    branches:
      - fix/final-routing-daily-cap

permissions:
  contents: write

jobs:
  align-routing-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout routing branch
        uses: actions/checkout@v4
        with:
          ref: fix/final-routing-daily-cap
          fetch-depth: 0

      - name: Remove obsolete manual-transfer contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('test/customer-service-full-flow.test.mjs')
          text = path.read_text()

          def replace_once(pattern: str, replacement: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')

          replace_once(
              r"\n  const standbyToken = 'agent-session-standby';.*?  assert\.equal\(requeued\.assignment\.id, 'agent-standby'\);\n",
              '\n',
              'isolated flow manual transfer block',
          )

          replace_once(
              r"\n  const cookieA = `cs_agent_session=\$\{tokenA\}`;.*?(?=\n  const topUpResponse = await adminConfigApi\.request)",
              '\n',
              'commercial lifecycle manual transfer block',
          )

          replacement = r'''  await json(disableResponse);
  assert.deepEqual(
    database
      .prepare(
        `SELECT id, assigned_agent
         FROM conversations
         WHERE id IN (?, ?, ?)
         ORDER BY id`,
      )
      .all(westOneId, westTwoId, westThreeId)
      .map((row) => row.assigned_agent),
    [null, null, null],
    'disabling a seat must leave its conversations waiting when every matching target has reached the daily reception limit',
  );
  assert.deepEqual(
    database
      .prepare(
        `SELECT a.traffic_quota_used AS used,
           COALESCE(SUM(s.conversation_count), 0) AS daily
         FROM agents a
         LEFT JOIN agent_daily_stats s ON s.agent_id = a.id
         WHERE a.id = ?
         GROUP BY a.id`,
      )
      .get(agentB),
    Object.assign(Object.create(null), { used: 1, daily: 1 }),
    'automatic reassignment must not bypass the target seat daily reception limit or consume quota again',
  );

'''
          replace_once(
              r"  await json\(disableResponse\);\n.*?(?=  assert\.deepEqual\(\n    database\n      \.prepare\(\n        `SELECT agent_id, COUNT\(\*\) AS count)",
              replacement,
              'disable-seat routing expectations',
          )

          text = text.replace(
              "immutable first-reception receipts must remain the billing source of truth after transfers",
              "immutable first-reception receipts must remain the billing source of truth after automatic routing changes",
          )

          for forbidden in ('transferTargets', '/transfer', 'targetAgentId'):
              if forbidden in text:
                  raise SystemExit(f'obsolete manual transfer contract remains: {forbidden}')

          path.write_text(text)
          PY

      - name: Commit aligned routing tests and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-routing-tests.yml
          git add test/customer-service-full-flow.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(routing): remove manual transfer contracts"
          git push origin HEAD:fix/final-routing-daily-cap
