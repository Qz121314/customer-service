name: Codex optimization patch

on:
  push:
    branches: [codex/realtime-routing-opt-20260814]

permissions:
  contents: write

concurrency:
  group: codex-customer-service-optimization
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: codex/realtime-routing-opt-20260814
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Apply ordered optimization patch
        run: |
          python .github/scripts/apply_codex_optimization.py
          python .github/scripts/fix_codex_optimization.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed sources
        run: pnpm format:write

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Commit verified optimization
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/codex-optimize.yml .github/scripts/apply_codex_optimization.py .github/scripts/fix_codex_optimization.py
          git add -A
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'perf: make realtime transport primary and harden routing'
          git push origin HEAD:codex/realtime-routing-opt-20260814
