name: Temporary conversation create hot-path patch

on:
  push:
    branches:
      - agent/bound-conversation-create-d1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bound-conversation-create-d1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply focused patch
        run: |
          python .github/scripts/tmp-patch-conversation-create.py
          python .github/scripts/tmp-fix-broadcast-return.py
      - name: Format changed files
        run: pnpm exec prettier --write src/worker/client-api.ts src/worker/routing.ts src/worker/agent-api.ts test/conversation-create-d1-cost.test.mjs
      - run: pnpm db:migrate:local
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test with captured output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm test 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-create-test-output
          path: test-output.log
      - name: Fail after preserving test output
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - run: pnpm build
      - run: pnpm cf:check
      - name: Commit validated patch and remove temporary tooling
        shell: bash
        run: |
          rm .github/scripts/tmp-patch-conversation-create.py
          rm .github/scripts/tmp-fix-broadcast-return.py
          rm .github/workflows/tmp-conversation-create-d1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bound conversation creation D1 work"
          git push origin HEAD:agent/bound-conversation-create-d1
