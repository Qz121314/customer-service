name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore agent deletion
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1))

          replace_once(
              'src/dashboard/api.ts',
              "  AGENT_CREATE_FAILED: '创建客服失败，请重新提交',\n",
              "  AGENT_CREATE_FAILED: '创建客服失败，请重新提交',\n  AGENT_DELETE_FAILED: '删除客服失败，请稍后重试',\n",
          )
          replace_once(
              'src/dashboard/api.ts',
              "export async function getAgentQuotaLedger(\n  id: string,\n): Promise<AgentQuotaLedgerPayload> {\n",
              "export async function deleteAgent(\n  id: string,\n): Promise<{ reassignedConversationCount: number }> {\n  return request(`/api/admin/agents/${encodeURIComponent(id)}`, {\n    method: 'DELETE',\n  });\n}\n\nexport async function getAgentQuotaLedger(\n  id: string,\n): Promise<AgentQuotaLedgerPayload> {\n",
          )

          replace_once(
              'src/dashboard/AdminPortal.tsx',
              "  createAgent,\n",
              "  createAgent,\n  deleteAgent,\n",
          )
          replace_once(
              'src/dashboard/AdminPortal.tsx',
              "  const [saving, setSaving] = useState(false);\n",
              "  const [saving, setSaving] = useState(false);\n  const [deletingAgentId, setDeletingAgentId] = useState<string | null>(null);\n",
          )
          delete_handler = r'''
  async function removeAgent(agent: AgentAccount) {
    if (deletingAgentId) return;
    const confirmed = window.confirm(
      `确定永久删除客服「${agent.name}」？\n\n删除后该账号将立即无法登录，当前未结束会话会释放并重新分配；历史聊天与统计记录会保留。`,
    );
    if (!confirmed) return;

    setDeletingAgentId(agent.id);
    setError('');
    try {
      await deleteAgent(agent.id);
      if (statisticsAgent?.id === agent.id) setStatisticsAgent(null);
      if (draft.id === agent.id) {
        setEditorOpen(false);
        setDraft(emptyAgentDraft);
        resetQuotaLedgerState();
      }
      await refresh();
    } catch (reason) {
      setError(message(reason, '删除客服失败'));
    } finally {
      setDeletingAgentId(null);
    }
  }

'''
          replace_once(
              'src/dashboard/AdminPortal.tsx',
              "  const sectionTitle = section === 'agents' ? '客服坐席' : '流量统计';\n",
              delete_handler + "  const sectionTitle = section === 'agents' ? '客服坐席' : '流量统计';\n",
          )
          replace_once(
