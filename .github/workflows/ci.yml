name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Format
        run: pnpm format

      - name: Commit exact Prettier output
        shell: bash
        run: |
          set -euo pipefail
          git add src/dashboard/AgentWorkspaceChrome.tsx src/dashboard/agent-mobile.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Format unified mobile agent UI"
          git push

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee /tmp/typecheck.log

      - name: Upload refactor diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ui-refactor-diagnostics
          path: /tmp/typecheck.log
          if-no-files-found: warn
          retention-days: 1

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Install browser smoke runtime
        run: |
          pnpm add -Dw --ignore-scripts @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Smoke test agent UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-worker.log
            exit 1
          fi

          pnpm exec playwright test test/agent-browser-smoke.spec.mjs --workers=1 --reporter=github

      - name: Deploy production to Cloudflare
        id: deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy:cloudflare | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production protocols
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke:production
