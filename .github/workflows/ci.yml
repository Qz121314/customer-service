name: Routing repair

on:
  push:
    branches: [refactor/simple-round-robin-routing]

permissions:
  contents: write

concurrency:
  group: routing-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/simple-round-robin-routing
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format routing changes
        run: |
          pnpm exec prettier --write \
            src/worker/routing.ts \
            src/worker/waiting-assignment.ts \
            src/dashboard/AgentWorkspacePanels.tsx \
            test/product-agent-routing.test.mjs \
            test/agent-daily-quota.test.mjs \
            test/agent-traffic-quota.test.mjs \
            test/agent-presence-cost.test.mjs \
            test/agent-reception-reliability.test.mjs \
            test/waiting-assignment-batch.test.mjs

      - name: Restore formal workflow
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Verify formatting and guardrails
        run: |
          pnpm guardrails
          pnpm format

      - name: Commit formatted routing changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: format routing refactor"
          git push origin HEAD:refactor/simple-round-robin-routing
