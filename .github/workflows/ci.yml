name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository guardrails
        run: pnpm guardrails

      - name: Format
        run: pnpm format

      - name: Prepare validation lanes in parallel
        shell: bash
        run: |
          set -uo pipefail

          static_lane() {
            pnpm lint
            pnpm typecheck:ui
          }

          database_lane() {
            pnpm db:migrate:local
            rm -rf /tmp/browser-d1-state
            mkdir -p /tmp/browser-d1-state
            cp -a .wrangler/state/. /tmp/browser-d1-state/
          }

          build_lane() {
            pnpm build:ui
          }

          browser_lane() {
            rm -rf /tmp/playwright-runtime
            mkdir -p /tmp/playwright-runtime
            printf '%s\n' '{"private":true}' > /tmp/playwright-runtime/package.json

            for attempt in 1 2; do
              if timeout --kill-after=30s 240s bash -c '
                set -euo pipefail
                pnpm --dir /tmp/playwright-runtime add --ignore-scripts --save-exact @playwright/test@1.55.0
                pnpm --dir /tmp/playwright-runtime exec playwright install chromium
              '; then
                return 0
              fi

              if [ "$attempt" -eq 1 ]; then
                echo "Playwright runtime preparation failed; retrying once."
                sleep 5
              fi
            done
            return 1
          }

          static_lane > /tmp/ci-static.log 2>&1 &
          static_pid=$!
          database_lane > /tmp/ci-database.log 2>&1 &
          database_pid=$!
          build_lane > /tmp/ci-build.log 2>&1 &
          build_pid=$!
          browser_lane > /tmp/ci-browser-runtime.log 2>&1 &
          browser_pid=$!

          static_status=0
          database_status=0
          build_status=0
          browser_status=0
          wait "$static_pid" || static_status=$?
          wait "$database_pid" || database_status=$?
          wait "$build_pid" || build_status=$?
          wait "$browser_pid" || browser_status=$?

          echo '--- static lane ---'
          cat /tmp/ci-static.log
          echo '--- database lane ---'
          cat /tmp/ci-database.log
          echo '--- build lane ---'
          cat /tmp/ci-build.log
          echo '--- browser runtime lane ---'
          cat /tmp/ci-browser-runtime.log

          if [ "$static_status" -ne 0 ] || [ "$database_status" -ne 0 ] || [ "$build_status" -ne 0 ] || [ "$browser_status" -ne 0 ]; then
            echo "::error::Parallel validation setup failed (static=$static_status database=$database_status build=$build_status browser=$browser_status)."
            exit 1
          fi

      - name: Validate Worker and tests in parallel
        shell: bash
        run: |
          set -uo pipefail

          pnpm test > /tmp/ci-test.log 2>&1 &
          test_pid=$!

          worker_status=0
          {
            pnpm typecheck:worker
            pnpm cf:check:bundle
          } > /tmp/ci-worker.log 2>&1 || worker_status=$?

          test_status=0
          wait "$test_pid" || test_status=$?

          echo '--- test lane ---'
          cat /tmp/ci-test.log
          echo '--- worker lane ---'
          cat /tmp/ci-worker.log

          if [ "$test_status" -ne 0 ] || [ "$worker_status" -ne 0 ]; then
            echo "::error::Worker/test validation failed (tests=$test_status worker=$worker_status)."
            exit 1
          fi

      - name: Restore clean D1 state and link Playwright runtime
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .wrangler/state
          mkdir -p .wrangler/state
          cp -a /tmp/browser-d1-state/. .wrangler/state/

          mkdir -p node_modules/@playwright
          rm -rf node_modules/@playwright/test
          playwright_test_path="$(readlink -f /tmp/playwright-runtime/node_modules/@playwright/test)"
          test -n "$playwright_test_path"
          ln -s "$playwright_test_path" node_modules/@playwright/test

          playwright_bin="/tmp/playwright-runtime/node_modules/.bin/playwright"
          test -x "$playwright_bin"
          echo "PLAYWRIGHT_BIN=$playwright_bin" >> "$GITHUB_ENV"

      - name: Smoke test Agent and Admin UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var INTEGRATION_VERIFY_TOKEN:ui-smoke-integration-token \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-worker.log
            exit 1
          fi

          "$PLAYWRIGHT_BIN" test \
            test/agent-browser-smoke.spec.mjs \
            test/agent-card-icon-browser-smoke.spec.mjs \
            test/agent-mobile-menu-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

          "$PLAYWRIGHT_BIN" test \
            test/admin-browser-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

      - name: Upload admin viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-viewport-geometry
          path: /tmp/admin-viewport-geometry.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload UI build
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: dist

      - name: Deploy production to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy:cloudflare | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production protocols
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke:production

      - name: Audit authenticated production performance
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          PERF_AUDIT_ADMIN_PASSWORD: ${{ secrets.PERF_AUDIT_ADMIN_PASSWORD }}
          PERF_AUDIT_AGENT_USERNAME: ${{ secrets.PERF_AUDIT_AGENT_USERNAME }}
          PERF_AUDIT_AGENT_PASSWORD: ${{ secrets.PERF_AUDIT_AGENT_PASSWORD }}
          PERF_AUDIT_RUNS: '3'
          PERF_AUDIT_OUTPUT: /tmp/production-performance-audit.json
          PERF_AUDIT_SUMMARY: /tmp/production-performance-audit.md
          PERF_AUDIT_ENFORCE: '0'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PERF_AUDIT_ADMIN_PASSWORD}" ] || missing+=(PERF_AUDIT_ADMIN_PASSWORD)
          [ -n "${PERF_AUDIT_AGENT_USERNAME}" ] || missing+=(PERF_AUDIT_AGENT_USERNAME)
          [ -n "${PERF_AUDIT_AGENT_PASSWORD}" ] || missing+=(PERF_AUDIT_AGENT_PASSWORD)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Production performance audit skipped; configure GitHub Actions secrets: ${missing[*]}"
            {
              echo '## Production performance audit'
              echo
              echo 'Skipped because the dedicated production audit credentials are not configured.'
              echo
              echo "Missing GitHub Actions secrets: \`${missing[*]}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pnpm perf:audit:production
          cat /tmp/production-performance-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production performance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-audit
          path: |
            /tmp/production-performance-audit.json
            /tmp/production-performance-audit.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish deployment handoff
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo '## Customer Service deployment ready'
            echo
            echo "- Worker: ${BASE_URL}"
            echo '- D1 migrations: applied'
            echo '- R2, Durable Object, Rate Limit, Cron and static assets: provisioned'
            echo '- Authenticated production performance audit: runs automatically when PERF_AUDIT_* secrets are configured'
            echo '- Next: set `ADMIN_PASSWORD` and `INTEGRATION_VERIFY_TOKEN` as Worker secrets'
            echo '- Optional: attach a Worker custom domain; keep the private chat-media R2 bucket without a public domain'
          } >> "$GITHUB_STEP_SUMMARY"
