name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository guardrails
        run: pnpm guardrails

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Test
        run: pnpm test

  build-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI
        run: pnpm build:ui

      - name: Validate Worker bundle
        run: pnpm cf:check:bundle

      - name: Upload UI build
        uses: actions/upload-artifact@v4
        with:
          name: ui-build
          path: dist
          if-no-files-found: error
          retention-days: 1

  browser-smoke:
    needs: build-and-bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: dist

      - name: Prepare browser smoke dependencies
        shell: bash
        run: |
          set -euo pipefail

          pnpm db:migrate:local > /tmp/browser-smoke-d1.log 2>&1 &
          d1_pid=$!
          cleanup() {
            kill "$d1_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          browser_status=1
          for attempt in 1 2; do
            if timeout --kill-after=30s 240s bash -c '
              set -euo pipefail
              pnpm add -Dw --ignore-scripts @playwright/test@1.55.0
              pnpm exec playwright install chromium
            '; then
              browser_status=0
              break
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Playwright Chromium runtime installation timed out or failed; retrying once."
              sleep 5
            fi
          done

          d1_status=0
          wait "$d1_pid" || d1_status=$?
          trap - EXIT

          if [ "$d1_status" -ne 0 ]; then
            echo "::error::Local D1 preparation for browser smoke failed."
            cat /tmp/browser-smoke-d1.log
            exit "$d1_status"
          fi

          if [ "$browser_status" -ne 0 ]; then
            echo "::error::Playwright Chromium runtime installation failed after two bounded attempts."
            exit 1
          fi

      - name: Smoke test Agent and Admin UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var INTEGRATION_VERIFY_TOKEN:ui-smoke-integration-token \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-worker.log
            exit 1
          fi

          pnpm exec playwright test \
            test/agent-browser-smoke.spec.mjs \
            test/agent-card-icon-browser-smoke.spec.mjs \
            test/agent-mobile-menu-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

          pnpm exec playwright test \
            test/admin-browser-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

      - name: Upload admin viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-viewport-geometry
          path: /tmp/admin-viewport-geometry.json
          if-no-files-found: ignore
          retention-days: 1

  deploy-production:
    needs:
      - static-checks
      - database-tests
      - build-and-bundle
      - browser-smoke
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download UI build
        uses: actions/download-artifact@v4
        with:
          name: ui-build
          path: dist

      - name: Deploy production to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy:cloudflare | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production protocols
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke:production

      - name: Audit authenticated production performance
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
          PERF_AUDIT_ADMIN_PASSWORD: ${{ secrets.PERF_AUDIT_ADMIN_PASSWORD }}
          PERF_AUDIT_AGENT_USERNAME: ${{ secrets.PERF_AUDIT_AGENT_USERNAME }}
          PERF_AUDIT_AGENT_PASSWORD: ${{ secrets.PERF_AUDIT_AGENT_PASSWORD }}
          PERF_AUDIT_RUNS: '3'
          PERF_AUDIT_OUTPUT: /tmp/production-performance-audit.json
          PERF_AUDIT_SUMMARY: /tmp/production-performance-audit.md
          PERF_AUDIT_ENFORCE: '0'
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PERF_AUDIT_ADMIN_PASSWORD}" ] || missing+=(PERF_AUDIT_ADMIN_PASSWORD)
          [ -n "${PERF_AUDIT_AGENT_USERNAME}" ] || missing+=(PERF_AUDIT_AGENT_USERNAME)
          [ -n "${PERF_AUDIT_AGENT_PASSWORD}" ] || missing+=(PERF_AUDIT_AGENT_PASSWORD)

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Production performance audit skipped; configure GitHub Actions secrets: ${missing[*]}"
            {
              echo '## Production performance audit'
              echo
              echo 'Skipped because the dedicated production audit credentials are not configured.'
              echo
              echo "Missing GitHub Actions secrets: \`${missing[*]}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          pnpm perf:audit:production
          cat /tmp/production-performance-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production performance audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-audit
          path: |
            /tmp/production-performance-audit.json
            /tmp/production-performance-audit.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish deployment handoff
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo '## Customer Service deployment ready'
            echo
            echo "- Worker: ${BASE_URL}"
            echo '- D1 migrations: applied'
            echo '- R2, Durable Object, Rate Limit, Cron and static assets: provisioned'
            echo '- Authenticated production performance audit: runs automatically when PERF_AUDIT_* secrets are configured'
            echo '- Next: set `ADMIN_PASSWORD` and `INTEGRATION_VERIFY_TOKEN` as Worker secrets'
            echo '- Optional: attach a Worker custom domain; keep the private chat-media R2 bucket without a public domain'
          } >> "$GITHUB_STEP_SUMMARY"
