name: CI and Deploy

on:
  push:
    branches: [fix/restore-agent-delete]

permissions:
  contents: write

jobs:
  validate-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore agent deletion
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/restore-agent-delete.py
          python /tmp/restore-agent-delete.py
          pnpm exec prettier --write src/dashboard/api.ts src/dashboard/AdminPortal.tsx src/dashboard/admin-agents.css src/worker/admin-config-api.ts test/customer-service-full-flow.test.mjs test/agent-delete-ui-contract.test.mjs
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Repository guardrails
        run: pnpm guardrails

      - name: Format
        run: pnpm format

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Install browser smoke runtime
        shell: bash
        run: |
          set -euo pipefail
          pnpm add -Dw --ignore-scripts @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Smoke test agent UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 --var ADMIN_PASSWORD:ui-smoke-admin-password --var ENVIRONMENT:ui-smoke --var APP_VERSION:ui-smoke > /tmp/ui-smoke-agent-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/ui-smoke-agent-worker.log; exit 1; fi
          pnpm exec playwright test test/agent-browser-smoke.spec.mjs test/agent-mobile-menu-smoke.spec.mjs --workers=1 --reporter=github

      - name: Smoke test admin UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 --var ADMIN_PASSWORD:ui-smoke-admin-password --var ENVIRONMENT:ui-smoke --var APP_VERSION:ui-smoke > /tmp/ui-smoke-admin-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/ui-smoke-admin-worker.log; exit 1; fi
          pnpm exec playwright test test/admin-browser-smoke.spec.mjs --workers=1 --reporter=github

      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ali Lee"
          git config user.email "fcqz121314@gmail.com"
          git add -A
          git commit -m "fix(admin): restore agent deletion"
          git push origin HEAD:fix/restore-agent-delete
