name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply precise routing test cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/final-routing-daily-cap'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('test/customer-service-full-flow.test.mjs')
          text = path.read_text()
          original = text

          def remove_once(pattern: str, label: str) -> None:
              global text
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          remove_once(
              r"\n  const standbyToken = 'agent-session-standby';.*?  assert\.equal\(requeued\.assignment\.id, 'agent-standby'\);\n",
              'isolated flow manual transfer block',
          )
          remove_once(
              r"\n  const cookieA = `cs_agent_session=\$\{tokenA\}`;.*?(?=\n  const topUpResponse = await adminConfigApi\.request)",
              'commercial lifecycle manual transfer block',
          )

          replace_once(
              """    [agentB, agentB, agentB],\n    'disabling a seat must reassign its already-counted active traffic even when the target has no new-traffic quota',""",
              """    [null, null, null],\n    'disabling a seat must leave its conversations waiting when every matching target has reached the daily reception limit',""",
              'disable-seat assignment expectation',
          )
          replace_once(
              """      .get(agentB),\n    beforeTransferB,\n    'reassignment after seat disable must not bill the target again',""",
              """      .get(agentB),\n    Object.assign(Object.create(null), { used: 1, daily: 1 }),\n    'automatic reassignment must not bypass the target seat daily reception limit or consume quota again',""",
              'disable-seat capped target expectation',
          )
          replace_once(
              'immutable first-reception receipts must remain the billing source of truth after transfers',
              'immutable first-reception receipts must remain the billing source of truth after automatic routing changes',
              'receipt wording',
          )

          for forbidden in ('transferTargets', '/transfer', 'targetAgentId', 'beforeTransferB'):
              if forbidden in text:
                  raise SystemExit(f'obsolete manual transfer contract remains: {forbidden}')

          if text == original:
              raise SystemExit('routing test cleanup made no changes')
          path.write_text(text)
          PY

          git add test/customer-service-full-flow.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(routing): remove manual transfer contracts precisely"
          git push origin HEAD:fix/final-routing-daily-cap

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository guardrails
        run: pnpm guardrails

      - name: Format
        run: pnpm format

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Install browser smoke runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout --kill-after=30s 420s bash -c '
              set -euo pipefail
              pnpm add -Dw --ignore-scripts @playwright/test@1.55.0
              pnpm exec playwright install --with-deps chromium
            '; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              echo "::error::Chromium smoke runtime installation failed after two bounded attempts."
              exit 1
            fi

            echo "::warning::Chromium smoke runtime installation timed out or failed; retrying once."
            sleep 5
          done

      - name: Smoke test agent UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-agent-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-agent-worker.log
            exit 1
          fi

          pnpm exec playwright test \
            test/agent-browser-smoke.spec.mjs \
            test/agent-mobile-menu-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

      - name: Smoke test admin UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-admin-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-admin-worker.log
            exit 1
          fi

          pnpm exec playwright test \
            test/admin-browser-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

      - name: Upload admin viewport diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-viewport-geometry
          path: /tmp/admin-viewport-geometry.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Deploy production to Cloudflare
        id: deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy:cloudflare | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production protocols
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke:production
