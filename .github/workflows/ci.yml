name: CI and Deploy

on:
  push:
    branches: [fix/agent-create-disabled-state]

permissions:
  contents: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair create-agent disabled state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          portal_path = Path('src/dashboard/AdminPortal.tsx')
          portal = portal_path.read_text()
          old = '          deleting={deletingAgentId === draft.id}'
          new = '''          deleting={
            editingAgentId !== null && deletingAgentId === editingAgentId
          }'''
          if old not in portal:
              raise SystemExit('expected create/delete state expression not found')
          portal_path.write_text(portal.replace(old, new, 1))

          smoke_path = Path('test/admin-browser-smoke.spec.mjs')
          smoke = smoke_path.read_text()
          marker = "test('admin create modal remains usable when no deletion is active'"
          if marker not in smoke:
              smoke += r'''

          test('admin create modal remains usable when no deletion is active', async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 760 });
            const adminLogin = await page.request.post(url('/api/auth/login'), {
              data: { password: adminPassword },
            });
            expect(adminLogin.ok()).toBeTruthy();

            await page.goto(url('/'));
            await page.getByRole('button', { name: '新增客服', exact: true }).first().click();

            const editor = page.getByRole('dialog', { name: '新增客服' });
            await expect(editor).toBeVisible();
            await expect(editor.getByRole('button', { name: '关闭' })).toBeEnabled();

            const createButton = editor.getByRole('button', { name: '创建客服' });
            await expect(createButton).toBeDisabled();

            const username = 'ui-create-smoke-agent';
            await editor.getByLabel('账号', { exact: true }).fill(username);
            await editor.getByLabel('登录密码', { exact: true }).fill('ui-create-smoke-pass');
            await expect(createButton).toBeEnabled();

            await createButton.click();
            await expect(editor).toBeHidden();
            await expect(
              page.getByRole('row').filter({ hasText: username }).first(),
            ).toBeVisible();
          });
          '''
              smoke_path.write_text(smoke)
          PY

      - name: Restore formal workflow
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Format repair
        run: pnpm exec prettier --write src/dashboard/AdminPortal.tsx test/admin-browser-smoke.spec.mjs

      - name: Repository guardrails
        run: pnpm guardrails

      - name: Format
        run: pnpm format

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Install browser smoke runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout --kill-after=30s 420s bash -c '
              set -euo pipefail
              pnpm add -Dw --ignore-scripts @playwright/test@1.55.0
              pnpm exec playwright install --with-deps chromium
            '; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Chromium smoke runtime installation failed after two bounded attempts."
              exit 1
            fi
            sleep 5
          done

      - name: Smoke test agent UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-agent-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-agent-worker.log
            exit 1
          fi
          pnpm exec playwright test \
            test/agent-browser-smoke.spec.mjs \
            test/agent-mobile-menu-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

      - name: Smoke test admin UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-admin-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-admin-worker.log
            exit 1
          fi
          pnpm exec playwright test \
            test/admin-browser-smoke.spec.mjs \
            --workers=1 \
            --reporter=github

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml src/dashboard/AdminPortal.tsx test/admin-browser-smoke.spec.mjs
          git diff --cached --quiet && { echo "No repair changes produced"; exit 1; }
          git commit -m "fix(admin): keep create-agent modal interactive"
          git push origin HEAD:fix/agent-create-disabled-state
