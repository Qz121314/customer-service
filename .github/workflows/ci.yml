name: Apply Preview Formatting

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-preview-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/cache-inbox-last-message

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format preview test
        run: pnpm exec prettier --write test/conversation-last-message-preview.test.mjs

      - name: Commit exact formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/conversation-last-message-preview.test.mjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/conversation-last-message-preview.test.mjs
          git commit -m "Format conversation preview regression"
          git push origin HEAD:agent/cache-inbox-last-message
