name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: customer-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apply-commercial-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'ui/agent-commercial-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ui/agent-commercial-closure
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply exact workspace patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/patch-agent-commercial-closure.yml').read_text()
          marker = '      - name: Patch agent workspace\n'
          start = workflow.index(marker)
          run_start = workflow.index('        run: |\n', start) + len('        run: |\n')
          end = workflow.index('      - name: Format changed files\n', run_start)
          raw = workflow[run_start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw.splitlines()
          ) + '\n'
          Path('/tmp/agent-commercial-patch.py').write_text(script)

      - name: Run exact workspace patch
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/agent-commercial-patch.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/dashboard/agent-mobile.css')
          text = path.read_text()
          old = """  .thread-actions {
            grid-template-columns: 64px 34px;
          }

          .thread-head select {
            width: 64px;
            min-width: 64px;
            padding-right: 20px;
            padding-left: 8px;
            background-position: right 6px center;
            font-size: 9px;
          }
          """
          new = """  .thread-actions {
            grid-template-columns: auto auto 34px;
          }

          .thread-status,
          .thread-status-action {
            padding-inline: 6px;
            font-size: 8px;
          }

          .thread-status {
            min-width: 44px;
          }

          .thread-status-action {
            min-width: 50px;
          }
          """
          if text.count(old) != 1:
              raise SystemExit(f'narrow mobile status block count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          src/dashboard/AgentPortal.tsx
          src/dashboard/AgentWorkspacePanels.tsx
          src/dashboard/agent-workspace.css
          src/dashboard/agent-desktop.css
          src/dashboard/agent-mobile.css
          test/agent-commercial-workspace.test.mjs

      - name: Validate focused contract
        run: node --test test/agent-commercial-workspace.test.mjs

      - name: Commit clean business patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-agent-commercial-closure.yml
          rm -f tmp-agent-commercial-trigger.txt
          git fetch origin main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Polish agent workspace conversation controls"
          git push origin HEAD:ui/agent-commercial-closure

  validate-and-deploy:
    if: github.event_name != 'pull_request' || github.head_ref != 'ui/agent-commercial-closure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local D1 migrations
        run: pnpm db:migrate:local

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Worker bundle
        run: pnpm cf:check

      - name: Install browser smoke runtime
        run: |
          pnpm add -Dw --ignore-scripts @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Smoke test agent UI in Chromium
        env:
          UI_SMOKE_BASE_URL: http://127.0.0.1:8787
          UI_SMOKE_ADMIN_PASSWORD: ui-smoke-admin-password
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler dev --local --port 8787 \
            --var ADMIN_PASSWORD:ui-smoke-admin-password \
            --var ENVIRONMENT:ui-smoke \
            --var APP_VERSION:ui-smoke \
            > /tmp/ui-smoke-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/ui-smoke-worker.log
            exit 1
          fi

          pnpm exec playwright test test/agent-browser-smoke.spec.mjs --workers=1 --reporter=github

      - name: Deploy production to Cloudflare
        id: deploy
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm deploy:cloudflare | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test production protocols
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke:production
