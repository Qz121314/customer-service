name: Format PR86 lifecycle test

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/conversation-lifecycle-closure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format lifecycle test
        run: pnpm exec prettier --write test/conversation-lifecycle-guards.test.mjs
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/conversation-lifecycle-guards.test.mjs
          git commit -m "Format conversation lifecycle test"
          git push origin HEAD:${{ github.head_ref }}
