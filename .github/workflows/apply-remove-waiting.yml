name: Apply Waiting Removal

on:
  push:
    branches:
      - remove-waiting-flow

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[applied-remove-waiting]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply focused patch
        run: |
          node scripts/apply-remove-waiting.mjs
          node scripts/apply-remove-waiting-followup.mjs
          node scripts/apply-remove-waiting-final-fixes.mjs

      - name: Format changed sources
        run: >-
          pnpm exec prettier --write
          src/worker/no-available-agent.ts
          src/worker/routing.ts
          src/worker/agent-api.ts
          src/worker/admin-config-api.ts
          src/worker/client-api.ts
          src/worker/entry.ts
          src/dashboard/UnavailableMessageSettingsPage.tsx
          src/dashboard/admin-settings.css
          src/dashboard/admin-entry.tsx
          test/product-agent-routing.test.mjs
          test/no-waiting-mode.test.mjs
          test/legacy-routing-removal.test.mjs
          README.md

      - name: Inspect stale waiting test expectation
        shell: bash
        run: |
          if test -f test/agent-quota.test.mjs; then
            sed -n '330,380p' test/agent-quota.test.mjs
          fi

      - name: Assert waiting implementation is gone
        shell: bash
        run: |
          test ! -e src/worker/waiting-assignment.ts
          if grep -R -n -E "assignWaitingConversations|recoverWaitingConversationAssignments|waiting-assignment" src; then
            echo "Waiting recovery residue remains in runtime source"
            exit 1
          fi

      - name: Hide temporary patch machinery
        shell: bash
        run: |
          mv .github/workflows/apply-remove-waiting.yml /tmp/apply-remove-waiting.yml
          mv scripts/apply-remove-waiting.mjs /tmp/apply-remove-waiting.mjs
          mv scripts/apply-remove-waiting-followup.mjs /tmp/apply-remove-waiting-followup.mjs
          mv scripts/apply-remove-waiting-final-fixes.mjs /tmp/apply-remove-waiting-final-fixes.mjs

      - name: Verify repository
        run: pnpm verify

      - name: Commit applied change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md migrations src test
          git diff --cached --check
          git commit -m "fix: remove waiting conversation flow [applied-remove-waiting]"
          git push origin HEAD:remove-waiting-flow
